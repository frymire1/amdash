# Codemagic pipeline for the Flutter apps (physician, ems, admin): build
# sanity checks, the real Firebase deploy for admin hosting + functions +
# firestore rules, and manual ad-hoc device distribution. physician/ems
# web *hosting* deploys from GitHub Actions instead (see flutter-web-
# deploy in .github/workflows/ci.yml), gated on this repo's own e2e
# passing on GitHub's infra first — everything else Flutter-related
# (functions, firestore rules, admin hosting, mobile builds/
# distribution) still lives here, manually triggered. GitHub Actions
# (.github/workflows/ci.yml — a single workflow covering secrets
# scanning, the Angular `marketing` site, `functions/`, and the Flutter
# apps) otherwise handles marketing's test/lint/build only; its hosting
# deploy is manual (see that file's own header comment).
#
# Every workflow below is manually triggered only (from the Codemagic UI or
# its REST API) — none has a `triggering:` block, so nothing here ever
# auto-runs on push. Testing (unit/widget tests, Patrol e2e against Chrome
# and Firebase Test Lab) used to live in this file as a chain fanning out
# from an auto-triggered `flutter-unit-tests` workflow; that whole chain —
# and the workflows that only existed to run it — has been removed. Test
# locally before pushing; this file now only builds and ships.
#
# TO VERIFY DURING SETUP (written from documentation/training knowledge,
# not validated against a live Codemagic account — check these against
# https://docs.codemagic.io before trusting this file to actually run):
#   - Built-in env var names ($CM_BUILD_DIR, $CM_PROJECT_ID) — confirm
#     current names in Codemagic's "Environment variables" reference.
#
# Every workflow below runs on mac_mini_m2, including the ones that don't
# need macOS at all (web builds, Android builds). This is not a design
# choice — it's a real account constraint: this Codemagic plan has no
# Linux minutes at all (linux and linux_x2 both came back "not available
# with the current billing plan" when tested), only mac_mini_m2. If Linux
# minutes are ever added to the plan, switching the non-iOS workflows back
# to a linux instance_type would be cheaper/faster and is the more natural
# fit.
#
# Env var groups referenced below (create in Codemagic -> Team settings ->
# Environment variables):
#   - firebase_deploy: FIREBASE_SERVICE_ACCOUNT_KEY (used for `firebase
#     deploy` and `firebase appdistribution:distribute`)

workflows:
  flutter-web-build:
    name: Flutter web build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Build physician/ems/admin (web)
        script: |
          set -e
          cd flutter
          for app in physician ems admin; do
            (cd "apps/$app" && flutter build web --release)
          done

  flutter-android-build:
    name: Flutter Android build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.pub-cache
    scripts:
      - name: Build physician/ems (Android debug APK)
        script: |
          cd flutter
          failed=()
          for app in physician ems; do
            (cd "apps/$app" && flutter build apk --debug) || failed+=("$app")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi

  flutter-ios-build:
    name: Flutter iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      # This job only runs a plain `flutter build ios --no-codesign`, never
      # `xcodebuild test-without-building` — the GitHub Actions Xcode-26 pin
      # (see the old ci.yml history) worked around a bug specific to that
      # command against a Simulator .xctestrun, so it may simply not apply
      # here. Re-verify once this runs for real before assuming a pin is
      # needed.
      xcode: latest
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/.pub-cache
    scripts:
      - name: Build physician/ems (iOS, no codesign)
        script: |
          cd flutter
          failed=()
          for app in physician ems; do
            (cd "apps/$app" && flutter build ios --debug --no-codesign) || failed+=("$app")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi

  flutter-deploy:
    name: Deploy admin + functions + firestore rules
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      node: latest
      groups:
        - firebase_deploy
    cache:
      cache_paths:
        - $HOME/.pub-cache
        # `npm ci` (used below) always wipes and reinstalls node_modules
        # from scratch, so caching node_modules itself wouldn't help —
        # npm's own download cache is what actually avoids re-fetching
        # packages from the registry on every run.
        - $HOME/.npm
    scripts:
      - name: Install functions dependencies
        script: npm ci
        working_directory: functions
      - name: Build functions
        script: npm run build
        working_directory: functions
      - name: Build admin (web)
        script: |
          set -e
          cd flutter
          (cd apps/admin && flutter build web --release)
      - name: Install Firebase CLI
        # --force: Codemagic's mac_mini_m2 images now ship firebase-tools
        # preinstalled at /usr/local/bin/firebase — a plain global install
        # fails with EEXIST trying to symlink over it. Confirmed via a
        # real build failure on flutter-deploy, previously working exactly
        # this way — an image-side change, not anything in this repo.
        script: npm install -g firebase-tools --force
      - name: Authenticate to Firebase
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      # Only admin's hosting + functions + firestore rules now —
      # physician/ems hosting moved to GitHub Actions (see
      # flutter-web-deploy in .github/workflows/ci.yml), gated on this
      # push's own e2e passing there first. `marketing` hosting is
      # deployed manually (not from either CI system, and not on every
      # push — see ci.yml's own header comment) since it's not a Flutter
      # app and has no reason to depend on Codemagic.
      - name: Deploy to amdash-dev
        script: |
          firebase deploy --only hosting:admin,functions,firestore:rules,firestore:indexes --project amdash-dev --non-interactive

  # Manual-trigger utility workflow. Builds a development-signed IPA
  # (installable on any device already registered on the account) and
  # pushes it to Firebase App Distribution. GOOGLE_APP_ID values below are
  # read directly from each app's GoogleService-Info.plist, not guessed.
  # Split per-app (physician/ems each get their own workflow below) rather
  # than one workflow handling both — Apple only ever grants this account
  # one active iOS Development certificate, and two apps sharing one
  # keychain/signing pass in the same job is a real source of
  # deletion-ordering bugs; separate jobs each doing their own isolated
  # fetch avoids that entirely.
  ios-adhoc-distribute:
    name: Build and deploy iOS Physician
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: amdash_ios
    environment:
      flutter: stable
      xcode: latest
      node: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.amdash.physician
      groups:
        - firebase_deploy
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      # --export-options-plist here (a flag on the fetch step itself, not
      # on `flutter build ipa`) writes a ready-made export options file
      # reflecting exactly the profile/cert this step just fetched —
      # confirmed via docs.codemagic.io/cli-tools that this is the
      # intended pattern for `flutter build ipa` afterward. A hand-written
      # signingStyle: automatic plist doesn't work here: `xcodebuild
      # -exportArchive` failed with "No Accounts" — it wants an
      # interactively-signed-in Xcode account for automatic resolution,
      # which doesn't exist on a CI machine authenticated via API key
      # instead.
      - name: Fetch signing profiles (physician)
        script: |
          xcode-project use-profiles \
            --project flutter/apps/physician/ios/Runner.xcodeproj \
            --export-options-plist=$CM_BUILD_DIR/physician_export_options.plist
      - name: Install Firebase CLI
        # --force: Codemagic's mac_mini_m2 images now ship firebase-tools
        # preinstalled at /usr/local/bin/firebase — a plain global install
        # fails with EEXIST trying to symlink over it. Confirmed via a
        # real build failure on flutter-deploy, previously working exactly
        # this way — an image-side change, not anything in this repo.
        script: npm install -g firebase-tools --force
      - name: Authenticate to Firebase
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      - name: Build + distribute physician IPA
        script: |
          set -e
          cd flutter/apps/physician
          flutter build ipa --release --export-options-plist=$CM_BUILD_DIR/physician_export_options.plist
          firebase appdistribution:distribute \
            build/ios/ipa/*.ipa \
            --app 1:577422583971:ios:552c78d74e0b0fae4fb716 \
            --testers "frymire1@gmail.com"

  ios-adhoc-distribute-ems:
    name: Build and deploy iOS EMS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: amdash_ios
    environment:
      flutter: stable
      xcode: latest
      node: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.amdash.ems
      groups:
        - firebase_deploy
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Fetch signing profiles (ems)
        script: |
          xcode-project use-profiles \
            --project flutter/apps/ems/ios/Runner.xcodeproj \
            --export-options-plist=$CM_BUILD_DIR/ems_export_options.plist
      - name: Install Firebase CLI
        script: npm install -g firebase-tools --force
      - name: Authenticate to Firebase
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      - name: Build + distribute ems IPA
        script: |
          set -e
          cd flutter/apps/ems
          flutter build ipa --release --export-options-plist=$CM_BUILD_DIR/ems_export_options.plist
          firebase appdistribution:distribute \
            build/ios/ipa/*.ipa \
            --app 1:577422583971:ios:427a94985db8fabb4fb716 \
            --testers "frymire1@gmail.com"

  # Android's signing model has none of the iOS cert/profile complexity —
  # no release keystore exists yet (see the earlier discussion about
  # eventual Play Store publishing), so these distribute a debug-signed
  # APK, same as flutter-android-build already builds successfully for CI
  # sanity checks. Fine for internal ad-hoc testing via Firebase App
  # Distribution; revisit once a real upload keystore exists for Play
  # Store release builds. GOOGLE_APP_ID values below are read directly
  # from each app's google-services.json (the "client" entry matching
  # each app's own package_name — a single google-services.json lists
  # every app registered under the Firebase project, not just one).
  android-adhoc-distribute:
    name: Build and deploy Android Physician
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      node: latest
      groups:
        - firebase_deploy
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Install Firebase CLI
        script: npm install -g firebase-tools --force
      - name: Authenticate to Firebase
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      - name: Build + distribute physician APK
        script: |
          set -e
          cd flutter/apps/physician
          flutter build apk --debug
          firebase appdistribution:distribute \
            build/app/outputs/apk/debug/app-debug.apk \
            --app 1:577422583971:android:ce60869f534a4b5b4fb716 \
            --testers "frymire1@gmail.com"

  android-adhoc-distribute-ems:
    name: Build and deploy Android EMS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      node: latest
      groups:
        - firebase_deploy
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Install Firebase CLI
        script: npm install -g firebase-tools --force
      - name: Authenticate to Firebase
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      - name: Build + distribute ems APK
        script: |
          set -e
          cd flutter/apps/ems
          flutter build apk --debug
          firebase appdistribution:distribute \
            build/app/outputs/apk/debug/app-debug.apk \
            --app 1:577422583971:android:08f6795a6a9af1a84fb716 \
            --testers "frymire1@gmail.com"
