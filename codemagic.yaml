# Codemagic pipeline for the Flutter apps (physician, ems, admin) and their
# Firebase deploy — replaces the flutter-* jobs that used to live in
# .github/workflows/ci.yml (see the migration plan). GitHub Actions now
# covers only the Angular `marketing` site.
#
# TO VERIFY DURING SETUP (written from documentation/training knowledge,
# not validated against a live Codemagic account — check these against
# https://docs.codemagic.io before trusting this file to actually run):
#   - Built-in env var names ($CM_BUILD_DIR, $CM_BRANCH, $CM_PROJECT_ID,
#     $CM_ENV) — confirm current names in Codemagic's "Environment variables"
#     reference.
#   - Whether `publishing.scripts` really does run regardless of build
#     success/failure (relied on below for guaranteed teardown of seeded
#     Firebase test data) — confirm in the current YAML reference before
#     trusting it the way this file's `android-e2e`/`ios-e2e-*` do.
#   - Whether a workflow with no `triggering:` block truly never
#     auto-builds on push (relied on so only flutter-unit-tests reacts to
#     push, and everything downstream only runs via the API-triggering
#     chain below).
#   - RESOLVED (the long way): iOS signing for physician + ems started as
#     ONE workflow calling `xcode-project use-profiles --project <path>`
#     per app, with a top-level `ios_signing.bundle_identifier` that could
#     only ever name one of them (physician). Every attempt to make ems's
#     explicit fetch work in that shared workflow hit a distinct, real
#     failure in sequence: `xcode-project use-profiles` only matches
#     provisioning profile FILES already on local disk rather than calling
#     the API itself, so ems's profile was never fetched by anything;
#     explicitly fetching it via `app-store-connect fetch-signing-files`
#     found the existing cert on Apple's side but couldn't save it
#     ("Cannot save Signing Certificates without certificate private key"
#     — that cert's private key only ever existed wherever it was
#     originally generated, inside Codemagic's own account vault via
#     physician's `ios_signing`-triggered flow, not accessible to a
#     separate raw API call); generating a dedicated second certificate
#     for ems hit Apple's hard account-wide limit of one active iOS
#     Development certificate (`409: You already have a current iOS
#     Development certificate`); and even before that limit was found,
#     sharing one keychain between two apps' certs created deletion-
#     ordering bugs (deleting physician's cert too early broke physician;
#     deleting by name instead of hash deleted the wrong one, since Apple
#     names every cert created via the same API key identically). Given
#     Apple will only ever grant this account one iOS Development
#     certificate, splitting into `ios-e2e-physician` / `ios-e2e-ems` and
#     `ios-adhoc-distribute` / `ios-adhoc-distribute-ems` — each with its
#     own `ios_signing.bundle_identifier`, its own isolated job/keychain —
#     was the right fix: each app now gets the exact automatic-fetch
#     treatment that always worked for physician, reusing the one
#     account-wide certificate independently instead of two workflows
#     fighting over one shared keychain.
#   - RESOLVED: a real Test Lab run confirmed Patrol's iOS integration
#     requires a genuine `RunnerUITests` Xcode target (a "UI Testing
#     Bundle") that Xcode's own GUI wizard normally creates — patrol_cli
#     cannot create Xcode targets itself, and this project was built
#     without Mac/Xcode access, so the target never existed. Without it,
#     `patrol build ios` silently fell back to the stock `RunnerTests`
#     unit-test target (empty of any real Patrol test), producing a
#     "0 test cases" / "Test failed to run" result with a fully successful
#     build/sign/upload otherwise. Fixed by hand-adding the target
#     directly to both apps' project.pbxproj + Podfile + shared scheme
#     (mirroring Patrol's documented manual Xcode setup steps —
#     https://patrol.leancode.co/documentation/physical-ios-devices-setup),
#     bundle id `com.amdash.{physician,ems}.RunnerUITests`.
#   - RESOLVED: `RunnerUITests` also needs its own `DEVELOPMENT_TEAM` build
#     setting hand-set directly in project.pbxproj — confirmed via a real
#     `--verbose` log ("Signing for RunnerUITests requires a development
#     team") that `xcode-project use-profiles` only ever processes the
#     `Runner` target, never `RunnerTests`/`RunnerUITests`. Separately, the
#     `<bundle id>.RunnerUITests.xctrunner` wrapper Xcode auto-generates to
#     host a UI test target on a real device isn't a literal project
#     target at all, so it needs its own registered App ID
#     (`com.amdash.{physician,ems}.RunnerUITests.xctrunner`) and an
#     explicit `app-store-connect fetch-signing-files` call — matches
#     Patrol's own documented manual setup for physical device signing.
#   - Android device string is confirmed real AND well-stocked:
#     model=tokay (Pixel 9), version 35 — verified via `gcloud firebase
#     test android models list` + `list-device-capacities` for amdash-dev.
#     A first attempt used model=t2q (Galaxy S21+ 5G), which is a real
#     device but had LOW capacity — Test Lab's physical device pool is
#     genuinely finite, and a matrix against a low-capacity device can
#     error out immediately with no logs at all (never actually dispatched
#     to a device) rather than queueing or falling back. Re-check
#     list-device-capacities occasionally if this starts erroring again —
#     capacity levels shift over time. iOS device string is now confirmed
#     real too: model=iphone14pro is Firebase's own "default"-tagged
#     model for amdash-dev, but the version placeholder (17.0) was wrong
#     — `gcloud firebase test ios models list` shows only 16.6 is
#     actually available for it (confirmed via a real "'17.0' is not a
#     valid OS version" error, after signing/build/upload all succeeded).
#     No iOS equivalent of Android's list-device-capacities subcommand
#     exists, so capacity for iphone14pro@16.6 is unverified — if it
#     errors out immediately with no logs (same symptom low-capacity
#     Android devices produced), that's the next thing to suspect.
#   - Whether Codemagic's linux images ship `gcloud`/`jq` preinstalled —
#     add an explicit install step if not.
#
# Cross-workflow chaining: Codemagic has no native `needs:`-style
# dependency graph between workflows, and no native "wait for N parallel
# predecessors" primitive either. Each workflow below ends with a script
# step that calls Codemagic's own REST API (POST /builds) to start the
# next workflow — see https://docs.codemagic.io/rest-api/builds/.
# flutter-unit-tests FANS OUT to flutter-web-build, flutter-android-build,
# flutter-ios-build, AND flutter-deploy all at once — a first version of
# this file chained them linearly instead (unit-tests -> web-build ->
# android-build -> ios-build -> deploy), which was simple but genuinely
# slow: total time was the SUM of all four stages instead of the slowest
# one. None of the three build-sanity workflows produce anything deploy
# consumes (deploy does its own web build + functions build inline), so
# there's no real dependency forcing them to wait on each other — only
# flutter-unit-tests passing matters as a gate. Fan-out from one
# predecessor needs no coordination (unlike a fan-in would), same pattern
# flutter-deploy already uses below to kick off web-e2e/android-e2e/
# ios-e2e-physician/ios-e2e-ems in parallel once it finishes.
#
# Trade-off: deploy no longer waits on flutter-android-build/flutter-ios-
# build succeeding first, so a currently-broken native build no longer
# blocks a web/functions deploy. Given deploy doesn't touch native build
# output at all, this seemed like the right trade for the wall-clock win —
# flutter-unit-tests (the actual correctness gate: analyze + widget/unit
# tests) still runs first and still gates everything.
#
# Every workflow below runs on mac_mini_m2, including the ones that don't
# need macOS at all (web builds, Android builds, Chrome e2e). This is not
# a design choice — it's a real account constraint: this Codemagic plan
# has no Linux minutes at all (linux and linux_x2 both came back "not
# available with the current billing plan" when tested), only mac_mini_m2.
# If Linux minutes are ever added to the plan, switching the non-iOS
# workflows back to a linux instance_type would be cheaper/faster and is
# the more natural fit. web-e2e's script steps were adjusted for this too
# — its old locale-gen/apt-get-install-xvfb steps were Linux-only fixes
# for a bare CI box with no display, which a real Mac already has; see
# nx-monorepo/scripts/lib/run-patrol.mjs's matching IS_MACOS check, which
# skips xvfb-run (also Linux-only, not installed on macOS) for the same
# reason.
#
# Env var groups referenced below (create in Codemagic -> Team settings ->
# Environment variables):
#   - codemagic_api: CM_API_TOKEN (a Codemagic personal API token, used only
#     for the workflow-chaining calls)
#   - firebase_deploy: FIREBASE_SERVICE_ACCOUNT_KEY (same key used by the
#     old GitHub Actions `deploy` job — reused here for `firebase deploy`
#     and for the seed/teardown scripts' Admin SDK calls)
#   - firebase_testlab: GCLOUD_TESTLAB_SERVICE_ACCOUNT_KEY (a separate
#     service account — do not widen firebase_deploy's key instead). NOT
#     currently least-privilege: roles/cloudtestservice.testAdmin +
#     roles/storage.admin alone produced "Matrix unexpectedly reached
#     final status ERROR" with zero logs/artifacts ever written, for every
#     android-e2e run, regardless of device/bucket/orchestrator-flag
#     changes — granting the account the broad Editor role was what
#     actually fixed it, confirming it was a permissions gap somewhere
#     Test Lab's result-writing path needs beyond those two roles. TODO:
#     narrow Editor back down (try roles/firebase.admin alongside the
#     existing two next, re-test, only settle for Editor if that still
#     isn't enough) — deferred to a future pass rather than blocking on it
#     now.

workflows:
  flutter-unit-tests:
    name: Flutter unit/widget tests
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - codemagic_api
    # Only master triggers the full pipeline automatically — every push to
    # flutter-switch tonight was firing all 8 mac_mini_m2 workflows, which
    # got expensive fast. Test e2e locally before pushing to any other
    # branch; the full CI/CD + Test Lab run is reserved for master.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Analyze amdash_core, physician, ems, admin
        script: |
          set -e
          cd flutter
          for dir in packages/amdash_core apps/physician apps/ems apps/admin; do
            (cd "$dir" && flutter pub get && flutter analyze)
          done
      - name: Run widget/unit tests
        script: |
          set -e
          cd flutter
          for dir in packages/amdash_core apps/physician apps/ems apps/admin; do
            (cd "$dir" && flutter test)
          done
      - name: Trigger flutter-web-build, flutter-android-build, flutter-ios-build, flutter-deploy
        script: |
          for workflow in flutter-web-build flutter-android-build flutter-ios-build flutter-deploy; do
            curl -sf -X POST https://api.codemagic.io/builds \
              -H "x-auth-token: $CM_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"appId\": \"$CM_PROJECT_ID\", \"workflowId\": \"$workflow\", \"branch\": \"$CM_BRANCH\"}"
          done

  # Not triggered directly on push — only via the fan-out above, to avoid
  # double-triggering the same commit through two paths.
  flutter-web-build:
    name: Flutter web build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Build physician/ems/admin (web)
        script: |
          set -e
          cd flutter
          for app in physician ems admin; do
            (cd "apps/$app" && flutter build web --release)
          done

  flutter-android-build:
    name: Flutter Android build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.pub-cache
    scripts:
      - name: Build physician/ems (Android debug APK)
        script: |
          cd flutter
          failed=()
          for app in physician ems; do
            (cd "apps/$app" && flutter build apk --debug) || failed+=("$app")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi

  flutter-ios-build:
    name: Flutter iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      # This job only runs a plain `flutter build ios --no-codesign`, never
      # `xcodebuild test-without-building` — the GitHub Actions Xcode-26 pin
      # (see the old ci.yml history) worked around a bug specific to that
      # command against a Simulator .xctestrun, so it may simply not apply
      # here. Re-verify once this runs for real before assuming a pin is
      # needed.
      xcode: latest
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/.pub-cache
    scripts:
      - name: Build physician/ems (iOS, no codesign)
        script: |
          cd flutter
          failed=()
          for app in physician ems; do
            (cd "apps/$app" && flutter build ios --debug --no-codesign) || failed+=("$app")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi

  flutter-deploy:
    name: Deploy Flutter apps + functions + firestore rules
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      node: latest
      groups:
        - firebase_deploy
        - codemagic_api
    cache:
      cache_paths:
        - $HOME/.pub-cache
        # `npm ci` (used below) always wipes and reinstalls node_modules
        # from scratch, so caching node_modules itself wouldn't help —
        # npm's own download cache is what actually avoids re-fetching
        # packages from the registry on every run.
        - $HOME/.npm
    scripts:
      - name: Install functions dependencies
        script: npm ci
        working_directory: functions
      - name: Build functions
        script: npm run build
        working_directory: functions
      - name: Build physician/ems/admin (web)
        script: |
          set -e
          cd flutter
          for app in physician ems admin; do
            (cd "apps/$app" && flutter build web --release)
          done
      - name: Install Firebase CLI
        # --force: Codemagic's mac_mini_m2 images now ship firebase-tools
        # preinstalled at /usr/local/bin/firebase — a plain global install
        # fails with EEXIST trying to symlink over it. Confirmed via a
        # real build failure on flutter-deploy, previously working exactly
        # this way — an image-side change, not anything in this repo.
        script: npm install -g firebase-tools --force
      - name: Authenticate to Firebase
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      # Only the Flutter apps' hosting + functions + firestore rules —
      # `marketing` hosting stays on GitHub Actions (see ci.yml's
      # deploy-marketing job) since it's not a Flutter app and has no
      # reason to depend on Codemagic. This is a deliberate split from the
      # old single atomic `firebase deploy` call — see the migration plan
      # for the accepted trade-off (marketing and functions/Flutter-hosting
      # deploys are no longer guaranteed to land together).
      - name: Deploy to amdash-dev
        script: |
          firebase deploy --only hosting:physician,hosting:ems,hosting:admin,functions,firestore:rules,firestore:indexes --project amdash-dev --non-interactive
      # e2e tests seed data and call *live* Functions/Firestore even though
      # the app under test runs on Chrome/Test Lab, not the deployed
      # hosting URL — so all of these have to wait for this deploy, same as
      # the old `needs: deploy` dependency in GitHub Actions.
      - name: Trigger web-e2e, android-e2e, ios-e2e-physician, ios-e2e-ems
        script: |
          for workflow in web-e2e android-e2e ios-e2e-physician ios-e2e-ems; do
            curl -sf -X POST https://api.codemagic.io/builds \
              -H "x-auth-token: $CM_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"appId\": \"$CM_PROJECT_ID\", \"workflowId\": \"$workflow\", \"branch\": \"$CM_BRANCH\"}"
          done

  web-e2e:
    name: Web e2e (Chrome)
    # Forced onto a Mac instance — this account's plan doesn't include any
    # Linux minutes at all (linux/linux_x2 both came back "not available
    # with the current billing plan"), only mac_mini_m2. A real Mac has
    # its own full display session, unlike a bare Linux CI box, so the
    # locale-gen/xvfb workarounds below (needed on Linux) don't apply —
    # see lib/run-patrol.mjs's matching platform check for the same reason
    # xvfb-run itself (Linux-only, not installed on macOS) is skipped now.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      node: latest
      vars:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
      groups:
        - firebase_deploy
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.npm
        # Playwright's own downloaded Chromium binary — without this,
        # `npx playwright install` below re-downloads it every run.
        - $HOME/.cache/ms-playwright
    scripts:
      - name: Install patrol_cli
        script: |
          dart pub global activate patrol_cli
          echo "PATH=$HOME/.pub-cache/bin:$PATH" >> $CM_ENV
      - name: Install nx-monorepo dependencies
        script: npm ci
        working_directory: nx-monorepo
      - name: Install Playwright browser + OS dependencies
        script: npx playwright install --with-deps chromium
        working_directory: nx-monorepo
      - name: Authenticate to Firebase
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      # Unchanged seed -> patrol test -> teardown shape, same scripts as
      # before — only the CI system underneath changed.
      - name: Run admin Patrol e2e
        script: node scripts/run-admin-patrol-test.mjs
        working_directory: nx-monorepo
      - name: Run physician Patrol e2e
        script: node scripts/run-physician-patrol-test.mjs
        working_directory: nx-monorepo
      - name: Run EMS Patrol e2e
        script: node scripts/run-ems-patrol-test.mjs
        working_directory: nx-monorepo
    artifacts:
      - flutter/apps/admin/playwright-report/**
      - flutter/apps/physician/playwright-report/**
      - flutter/apps/ems/playwright-report/**

  # No local emulator anymore — physician/ems run on Firebase Test Lab's
  # real device pool instead. admin stays out of native e2e (web-only, see
  # web-e2e above), same as before.
  android-e2e:
    name: Android e2e (Firebase Test Lab)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      node: latest
      groups:
        - firebase_deploy
        - firebase_testlab
    cache:
      cache_paths:
        # $HOME/.pub-cache matters a lot here specifically — without it,
        # `dart pub global activate patrol_cli` below recompiles patrol_cli
        # from source on every single run.
        - $HOME/.pub-cache
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Authenticate to Firebase Admin SDK
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      - name: Authenticate gcloud to Test Lab
        script: |
          echo "$GCLOUD_TESTLAB_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/testlab-service-account.json"
          gcloud auth activate-service-account --key-file="$CM_BUILD_DIR/testlab-service-account.json"
          gcloud config set project amdash-dev
      - name: Install patrol_cli
        script: |
          dart pub global activate patrol_cli
          echo "PATH=$HOME/.pub-cache/bin:$PATH" >> $CM_ENV
      - name: Install nx-monorepo dependencies
        script: npm ci
        working_directory: nx-monorepo
      # Seeding and teardown are split across separate steps (unlike
      # web-e2e's single-process seed->test->teardown) because
      # `patrol build` + `gcloud ... run` doesn't fit that shape — see
      # run-physician-patrol-test.mjs / run-ems-patrol-test.mjs's
      # --seed-only/--teardown modes.
      - name: Seed physician + ems smoke accounts
        script: |
          node scripts/run-physician-patrol-test.mjs --seed-only --account-json="$CM_BUILD_DIR/physician-account.json"
          node scripts/run-ems-patrol-test.mjs --seed-only --account-json="$CM_BUILD_DIR/ems-account.json"
        working_directory: nx-monorepo
      - name: Build + run physician Test Lab suite (Android)
        script: |
          set -e
          ACCOUNT="$CM_BUILD_DIR/physician-account.json"
          cd flutter/apps/physician
          patrol build android --target patrol_test/patient_flow_test.dart \
            --dart-define SMOKE_EMAIL="$(jq -r .email "$ACCOUNT")" \
            --dart-define SMOKE_PASSWORD="$(jq -r .password "$ACCOUNT")" \
            --dart-define SMOKE_HOSPITAL="$(jq -r .hospitalName "$ACCOUNT")" \
            --dart-define SMOKE_PATIENT_NAME="$(jq -r .patientName "$ACCOUNT")"
          # No --use-orchestrator: the matrix errored immediately with zero
          # logs/artifacts across two different devices (one low-capacity,
          # one high) — pointing at the test config itself rather than
          # device availability. AndroidX Test Orchestrator requires the
          # androidTest APK to be specifically built for it; Patrol's
          # generated instrumentation APK likely isn't, so requesting it
          # explicitly may have caused Test Lab to reject the submission
          # outright before ever dispatching to a device.
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=tokay,version=35,locale=en,orientation=portrait \
            --results-bucket=gs://amdash-dev-test-lab-results
      - name: Build + run ems Test Lab suite (Android)
        script: |
          set -e
          ACCOUNT="$CM_BUILD_DIR/ems-account.json"
          cd flutter/apps/ems
          patrol build android --target patrol_test/ems_test.dart \
            --dart-define SMOKE_EMAIL="$(jq -r .email "$ACCOUNT")" \
            --dart-define SMOKE_PASSWORD="$(jq -r .password "$ACCOUNT")"
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=tokay,version=35,locale=en,orientation=portrait \
            --results-bucket=gs://amdash-dev-test-lab-results
    # Saved regardless of whether the workflow ultimately succeeds or
    # fails (e.g. at the gcloud Test Lab step) — lets you grab a real APK
    # from a failed build's page in the Codemagic UI without needing a
    # local Android toolchain, e.g. for Firebase Test Lab Console's own
    # one-time "upload an app" onboarding step.
    artifacts:
      - flutter/apps/physician/build/app/outputs/apk/debug/app-debug.apk
      - flutter/apps/ems/build/app/outputs/apk/debug/app-debug.apk
    publishing:
      # Relies on publishing.scripts running regardless of build
      # success/failure (see the TODO at the top of this file) — this is
      # what gives teardown the same guarantee the old single-process
      # try/finally had, now that seed/build/run/teardown are separate
      # steps. `|| true` on each so one app's teardown failing doesn't
      # skip the other's.
      scripts:
        - name: Teardown physician + ems smoke accounts
          script: |
            cd nx-monorepo
            node scripts/run-physician-patrol-test.mjs --teardown --account-json="$CM_BUILD_DIR/physician-account.json" || true
            node scripts/run-ems-patrol-test.mjs --teardown --account-json="$CM_BUILD_DIR/ems-account.json" || true

  # Split into one workflow per app (see the header comment's RESOLVED note
  # on iOS signing) — each app gets its own isolated job/keychain and its
  # own ios_signing.bundle_identifier, which is what actually made
  # automatic certificate/profile fetching work reliably. A single shared
  # workflow kept hitting real, distinct failures trying to make two apps'
  # signing coexist in one keychain: profile-fetch tooling that only
  # matches local files, private keys that only exist in Codemagic's
  # per-`ios_signing` vault, Apple's hard one-certificate-per-account
  # limit, and cert-deletion ordering bugs once a second cert was
  # (wrongly) attempted.
  ios-e2e-physician:
    name: iOS e2e (Firebase Test Lab) — physician
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      node: latest
      # RESOLVED (the long way — see the header comment's note on this):
      # the API-key-based `ios_signing.distribution_type +
      # bundle_identifier` mode never worked for RunnerUITests's
      # `.xctrunner` wrapper, no matter how the profile/certificate was
      # fetched — every raw app-store-connect CLI path either couldn't
      # save a certificate without a local private key, or saved a
      # profile to a directory xcodebuild's automatic-signing engine
      # doesn't actually search. Switched to Codemagic's OTHER `ios_signing`
      # mode instead: reference manually-generated/uploaded certificates
      # and provisioning profiles by name (Team settings -> Code signing
      # identities), the same pattern Codemagic's own official Patrol demo
      # project uses
      # (codemagic-sample-projects/integrations/patrol-demo-project) for
      # this exact scenario. This mode applies everything as a hidden
      # pre-build step, same as the old mode did for the main app alone —
      # no more manual fetch steps needed at all. Needs BOTH a development
      # and an ad-hoc (distribution-type) certificate/profile — Test Lab's
      # physical-device dispatch needs ad-hoc signing for the main app,
      # confirmed via that same official example.
      ios_signing:
        certificates:
          - amdash_ios
          - physician_adhoc
        provisioning_profiles:
          # Codemagic assigns its own reference name when a profile is
          # fetched/synced into Team settings -> Code signing identities ->
          # iOS provisioning profiles — confirmed via a real error listing
          # physician_dev_provisioning_file as the only available option at
          # the time, distinct from the profile's actual name on Apple's
          # portal ("AmDash Physician Development"). The other two were
          # fetched afterward, chosen at fetch time to match this naming
          # pattern.
          - physician_dev_provisioning_file
          - physician_runneruitests_xctrunner_provisioning_file
          - physician_adhoc_provisioning_file
      groups:
        - firebase_deploy
        - firebase_testlab
    cache:
      cache_paths:
        # $HOME/.pub-cache matters a lot here specifically — without it,
        # `dart pub global activate patrol_cli` below recompiles patrol_cli
        # from source on every single run.
        - $HOME/.pub-cache
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Authenticate to Firebase Admin SDK
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      - name: Authenticate gcloud to Test Lab
        script: |
          echo "$GCLOUD_TESTLAB_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/testlab-service-account.json"
          gcloud auth activate-service-account --key-file="$CM_BUILD_DIR/testlab-service-account.json"
          gcloud config set project amdash-dev
      # The reference-based ios_signing block above fetches the referenced
      # certs/profiles into the keychain/profiles directory as a hidden
      # pre-build step, but doesn't itself apply them to the Xcode project
      # — removing this step entirely broke even the Runner target, which
      # had always worked before (confirmed via a real regression: "Signing
      # for 'Runner' requires a development team", something that had never
      # failed across dozens of prior runs). xcode-project use-profiles is
      # what actually switches targets from Automatic to Manual signing
      # with an explicit profile — still needed even with all the right
      # certs/profiles now available.
      - name: Apply signing profiles (physician)
        script: xcode-project use-profiles --project flutter/apps/physician/ios/Runner.xcodeproj
      - name: Install patrol_cli
        script: |
          dart pub global activate patrol_cli
          echo "PATH=$HOME/.pub-cache/bin:$PATH" >> $CM_ENV
      - name: Install nx-monorepo dependencies
        script: npm ci
        working_directory: nx-monorepo
      - name: Seed physician smoke account
        script: node scripts/run-physician-patrol-test.mjs --seed-only --account-json="$CM_BUILD_DIR/physician-account.json"
        working_directory: nx-monorepo
      # Must be --release and properly signed — Test Lab's iOS tier is real
      # devices only, no simulator, unlike the old (broken) local-Simulator
      # ios-e2e job. This is what actually retires the patrol_cli
      # arch-ambiguity bug: no local `xcodebuild test-without-building`
      # destination resolution happens at all here, since `patrol build`
      # only builds artifacts and Test Lab's own device farm runs them.
      - name: Build + run physician Test Lab suite (iOS)
        script: |
          set -e
          ACCOUNT="$CM_BUILD_DIR/physician-account.json"
          cd flutter/apps/physician
          # --verbose: the default output swallows xcodebuild's actual
          # error lines, printing only a "** TEST BUILD FAILED **"
          # pass/fail summary with no way to tell what actually failed.
          patrol build ios --target patrol_test/patient_flow_test.dart --release --verbose \
            --dart-define SMOKE_EMAIL="$(jq -r .email "$ACCOUNT")" \
            --dart-define SMOKE_PASSWORD="$(jq -r .password "$ACCOUNT")" \
            --dart-define SMOKE_HOSPITAL="$(jq -r .hospitalName "$ACCOUNT")" \
            --dart-define SMOKE_PATIENT_NAME="$(jq -r .patientName "$ACCOUNT")"
          cd build/ios_integ/Build/Products
          # Filename embeds the SDK version used to build it — glob for it,
          # don't hardcode a version.
          XCTESTRUN=$(ls Runner_iphoneos*-arm64.xctestrun)
          zip -r ios_tests.zip Release-iphoneos "$XCTESTRUN"
          gcloud firebase test ios run \
            --test ios_tests.zip \
            --device model=iphone14pro,version=16.6,locale=en_US,orientation=portrait \
            --results-bucket=gs://amdash-dev-test-lab-results
    publishing:
      scripts:
        - name: Teardown physician smoke account
          script: |
            cd nx-monorepo
            node scripts/run-physician-patrol-test.mjs --teardown --account-json="$CM_BUILD_DIR/physician-account.json" || true

  ios-e2e-ems:
    name: iOS e2e (Firebase Test Lab) — ems
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: amdash_ios
    environment:
      flutter: stable
      xcode: latest
      node: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.amdash.ems
      groups:
        - firebase_deploy
        - firebase_testlab
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Authenticate to Firebase Admin SDK
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      - name: Authenticate gcloud to Test Lab
        script: |
          echo "$GCLOUD_TESTLAB_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/testlab-service-account.json"
          gcloud auth activate-service-account --key-file="$CM_BUILD_DIR/testlab-service-account.json"
          gcloud config set project amdash-dev
      - name: Fetch signing profiles (ems)
        script: xcode-project use-profiles --project flutter/apps/ems/ios/Runner.xcodeproj
      # Same fix as physician's equivalent step — fetch-signing-files always
      # tries to resolve/save a certificate even with --create removed;
      # profiles list --save only ever touches profiles. --profiles-dir
      # forces the traditional ~/Library/MobileDevice/Provisioning Profiles
      # location, which is where xcodebuild's automatic-signing engine
      # actually looks at build time (its own default,
      # UserData/Provisioning Profiles, isn't).
      - name: Fetch signing profiles (RunnerUITests.xctrunner profiles)
        script: |
          app-store-connect profiles list --type IOS_APP_DEVELOPMENT --save \
            --profiles-dir="$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Install patrol_cli
        script: |
          dart pub global activate patrol_cli
          echo "PATH=$HOME/.pub-cache/bin:$PATH" >> $CM_ENV
      - name: Install nx-monorepo dependencies
        script: npm ci
        working_directory: nx-monorepo
      - name: Seed ems smoke account
        script: node scripts/run-ems-patrol-test.mjs --seed-only --account-json="$CM_BUILD_DIR/ems-account.json"
        working_directory: nx-monorepo
      - name: Build + run ems Test Lab suite (iOS)
        script: |
          set -e
          ACCOUNT="$CM_BUILD_DIR/ems-account.json"
          cd flutter/apps/ems
          patrol build ios --target patrol_test/ems_test.dart --release --verbose \
            --dart-define SMOKE_EMAIL="$(jq -r .email "$ACCOUNT")" \
            --dart-define SMOKE_PASSWORD="$(jq -r .password "$ACCOUNT")"
          cd build/ios_integ/Build/Products
          XCTESTRUN=$(ls Runner_iphoneos*-arm64.xctestrun)
          zip -r ios_tests.zip Release-iphoneos "$XCTESTRUN"
          gcloud firebase test ios run \
            --test ios_tests.zip \
            --device model=iphone14pro,version=16.6,locale=en_US,orientation=portrait \
            --results-bucket=gs://amdash-dev-test-lab-results
    publishing:
      scripts:
        - name: Teardown ems smoke account
          script: |
            cd nx-monorepo
            node scripts/run-ems-patrol-test.mjs --teardown --account-json="$CM_BUILD_DIR/ems-account.json" || true

  # Manual-trigger-only utility workflow — not part of the e2e chain, so a
  # still-failing Patrol UI test target doesn't block getting a real build
  # onto a phone. Builds a development-signed IPA (installable on any
  # device already registered on the account, e.g. the one added earlier
  # for ios-e2e-physician) and pushes it to Firebase App Distribution,
  # reusing the same signing setup. GOOGLE_APP_ID values below are read
  # directly from each app's GoogleService-Info.plist, not guessed. See the
  # header comment's RESOLVED note on why this is split per-app rather than
  # one workflow handling both.
  ios-adhoc-distribute:
    name: Build and deploy iOS Physician
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: amdash_ios
    environment:
      flutter: stable
      xcode: latest
      node: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.amdash.physician
      groups:
        - firebase_deploy
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      # --export-options-plist here (a flag on the fetch step itself, not
      # on `flutter build ipa`) writes a ready-made export options file
      # reflecting exactly the profile/cert this step just fetched —
      # confirmed via docs.codemagic.io/cli-tools that this is the
      # intended pattern for `flutter build ipa` afterward. A hand-written
      # signingStyle: automatic plist doesn't work here: `xcodebuild
      # -exportArchive` failed with "No Accounts" — it wants an
      # interactively-signed-in Xcode account for automatic resolution,
      # which doesn't exist on a CI machine authenticated via API key
      # instead.
      - name: Fetch signing profiles (physician)
        script: |
          xcode-project use-profiles \
            --project flutter/apps/physician/ios/Runner.xcodeproj \
            --export-options-plist=$CM_BUILD_DIR/physician_export_options.plist
      - name: Install Firebase CLI
        # --force: Codemagic's mac_mini_m2 images now ship firebase-tools
        # preinstalled at /usr/local/bin/firebase — a plain global install
        # fails with EEXIST trying to symlink over it. Confirmed via a
        # real build failure on flutter-deploy, previously working exactly
        # this way — an image-side change, not anything in this repo.
        script: npm install -g firebase-tools --force
      - name: Authenticate to Firebase
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$CM_BUILD_DIR/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase-service-account.json" >> $CM_ENV
      - name: Build + distribute physician IPA
        script: |
          set -e
          cd flutter/apps/physician
          flutter build ipa --release --export-options-plist=$CM_BUILD_DIR/physician_export_options.plist
          firebase appdistribution:distribute \
            build/ios/ipa/*.ipa \
            --app 1:577422583971:ios:552c78d74e0b0fae4fb716 \
            --testers "frymire1@gmail.com"

