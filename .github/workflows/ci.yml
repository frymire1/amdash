name: CI

# One workflow, one run per push — covers the whole repo: GitGuardian
# secrets scanning, marketing (Angular) test/lint/build, functions
# (TypeScript build + vitest coverage), and Flutter analyze/unit-test
# (+ coverage gate) on every push; e2e (Chrome + Firebase Test Lab
# Android) and physician/ems web deploy on master only. This used
# to be two separate workflow files (`ci.yml` for marketing, `flutter-ci.yml`
# for everything else) that both fired on every push — merged into one so
# a single push only shows one CI run instead of two unrelated ones.
#
# All 4 apps' web hosting migrated from Firebase Hosting to Cloud Run —
# see deploy/web/Dockerfile (the one shared container image all 4 use)
# and deploy-web-cloud-run.yml (manual per-app redeploy tool for any of
# physician/ems/admin/marketing; also where this migration's own
# history/reasoning is documented). marketing's deploy is deliberately
# NOT automated here — the site changes rarely enough that
# auto-deploying on every push wasn't worth it — trigger
# deploy-web-cloud-run.yml by hand
# (`gh workflow run deploy-web-cloud-run.yml -f app=marketing`) when it
# actually changes. Functions and firestore rules/indexes also moved
# off Codemagic to their own manual GitHub Actions workflows —
# deploy-functions.yml, deploy-firestore-rules.yml — for the same
# free-Linux-runner reason as everything else here. Only genuine
# iOS/Xcode work (mobile builds/ad-hoc distribution) remains on
# Codemagic now — see codemagic.yaml.
#
# Deliberately not on Codemagic: none of the jobs below need macOS, and
# GitHub's Linux runners are free on the plans this repo uses, unlike
# Codemagic's per-minute mac_mini_m2 pricing (see codemagic.yaml's own
# history — that's exactly why its testing workflows were removed and
# this file exists instead). iOS e2e stays off entirely — Xcode/signing
# is the genuinely expensive, complex part regardless of which CI system
# runs it; the ios-adhoc-distribute* workflows in codemagic.yaml remain
# the way to get a real iOS build, manually, when needed.
#
# e2e doesn't gate a deploy the way this file's old ci.yml `deploy-marketing`
# job did — the flutter-web-e2e-*/flutter-android-e2e-* jobs are a smoke
# test of whatever's currently live on amdash-dev, not a pre-deploy check,
# with one exception: flutter-web-deploy below deploys physician/ems to
# Cloud Run automatically once this exact push's own e2e has passed here.
#
# Required repo secrets (GitHub -> Settings -> Secrets and variables ->
# Actions):
#   - GITGUARDIAN_API_KEY — GitGuardian dashboard-issued key (scoped to
#     "scan").
#   - FIREBASE_SERVICE_ACCOUNT_KEY — used by the flutter-web-e2e-*/
#     flutter-android-e2e-* jobs' Admin SDK-based test-account
#     seeding/teardown (see scripts/lib/firebase-admin-cli.mjs) — no
#     longer used for hosting deploys now that those are on Cloud Run
#     via WIF (see flutter-web-deploy below and deploy-web-cloud-run.yml).
#   - FIREBASE_APPCHECK_DEBUG_TOKEN — a debug token registered by hand in
#     Firebase Console -> App Check -> (app) -> Manage debug tokens, passed
#     as a --dart-define to the flutter-android-e2e-physician/-ems `patrol
#     build android` steps so App Check's debug provider (see
#     flutter/apps/{physician,ems}/lib/main.dart) can mint a real token
#     during that job instead of falling back to an unregistered
#     auto-generated one. Not needed by the flutter-web-e2e-* jobs — the
#     web platform always uses the reCAPTCHA provider, never the debug
#     one, regardless of build mode. App Check is monitor-mode only right
#     now (see SECURITY.md), so nothing actually rejects requests yet even
#     without this secret set — it's here so the eventual enforcement flip
#     doesn't break this job on the day it happens.
#
# flutter-android-e2e authenticates to Google Cloud via Workload Identity
# Federation, not a service account key — this org has
# iam.managed.disableServiceAccountKeyCreation enforced (a real security
# improvement, not something to work around), which blocks minting a new
# key for the codemagic-testlab service account entirely. WIF is Google's
# recommended keyless replacement for exactly this scenario: GitHub issues
# a short-lived OIDC token per run, which Google exchanges for that
# service account's permissions, scoped so only the frymire1/amdash repo
# can do this at all — no long-lived credential stored anywhere. One-time
# setup already done (Cloud Shell, project amdash-dev):
#   - Workload identity pool: github-actions-pool
#   - Provider: github-actions-provider (OIDC issuer
#     https://token.actions.githubusercontent.com, attribute-condition
#     restricting to assertion.repository=='frymire1/amdash')
#   - codemagic-testlab@amdash-dev.iam.gserviceaccount.com granted
#     roles/iam.workloadIdentityUser to that pool's principalSet, scoped
#     to this repo.
# The job below needs `permissions: id-token: write` for GitHub to be
# allowed to mint that OIDC token in the first place — without it, the
# auth step fails even with everything above configured correctly.

on:
  push:

jobs:
  # Scans the whole repo (not just marketing/ or flutter/) — a leaked
  # secret is exactly as bad in functions/ or a Flutter app as it is in
  # marketing. Runs independently of every other job here (no `needs:`),
  # so any push gets scanned even if it only touches one part of the repo.
  secrets-scan:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed so ggshield can see the actual pushed commit range, not
          # just a single-commit shallow clone.
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  marketing-test:
    name: Marketing test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Test
        run: npm test
        working-directory: marketing

  marketing-lint:
    name: Marketing lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Lint
        run: npm run lint
        working-directory: marketing

  marketing-build:
    name: Marketing build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Build
        run: npm run build
        working-directory: marketing

  flutter-analyze-test:
    name: Flutter analyze + unit/widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze amdash_core, physician, ems, admin
        run: |
          set -e
          for dir in packages/amdash_core apps/physician apps/ems apps/admin; do
            (cd "$dir" && flutter pub get && flutter analyze)
          done
        working-directory: flutter

      # --coverage on all four so lcov.info is always produced/uploaded as
      # an artifact-free build log signal. All four are gated below now —
      # ems/physician/admin gained real Stage B tests alongside
      # amdash_core's own Stage A backfill (see TESTING.md's roadmap).
      - name: Run widget/unit tests
        run: |
          set -e
          for dir in packages/amdash_core apps/physician apps/ems apps/admin; do
            (cd "$dir" && flutter test --coverage)
          done
        working-directory: flutter

      # See TESTING.md for the current thresholds and the plan to ratchet
      # them up as more of each app's own widgets/screens get covered.
      # min_coverage is a floor set to what's actually measured today, not
      # a guess — ems/physician/admin's own numbers only reflect the
      # files their tests actually load (Dart's coverage collector only
      # instruments files reached via the test run's import graph), not
      # each app's full lib/ tree, since none of their test suites import
      # router.dart (the one file that would transitively pull every
      # screen/widget in) — see TESTING.md's own note on this.
      #
      # amdash_core/ems/physician all ratcheted up again for Stage C1
      # (amdash_core's own widgets/screens + idle_timeout_wrapper.dart,
      # plus ems's patient-upload flow and physician's map/patient-viewer
      # by explicit request) — measured 97.49%/98.30%/100.00%
      # respectively; each floor is set a couple points under its own
      # measured value, not the literal number, so an incidental single-
      # line regression elsewhere doesn't flip the gate red over noise.
      # amdash_core's remaining gap is entirely the same well-known Dart
      # coverage-tool artifact for `const` widget constructors invoked
      # only via `const` call sites (documented in TESTING.md); ems's is
      # entirely the pre-existing, out-of-scope generated
      # firebase_options.dart.
      #
      # ems/physician/admin ratcheted up again for Stage C2 (the rest of
      # each app's widgets/screens — home/patient-viewer/user-settings/
      # patient-summary-card for ems; patient-card/patient-list/main-view/
      # user-settings for physician; every remaining admin screen and
      # widget, admin's first widget-test coverage at all) — measured
      # 98.76%/100.00%/97.40% respectively. physician's is now genuinely
      # 100.00% (not just floored a couple points under, like the others)
      # — its only remaining gaps were the const-constructor artifact,
      # closed by dropping `const` at the one test call site each that hit
      # it, same fix as amdash_core's own precedent.
      - name: Enforce amdash_core coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: flutter/packages/amdash_core/coverage/lcov.info
          min_coverage: 95

      - name: Enforce ems coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: flutter/apps/ems/coverage/lcov.info
          min_coverage: 98

      - name: Enforce physician coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: flutter/apps/physician/coverage/lcov.info
          min_coverage: 100

      - name: Enforce admin coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: flutter/apps/admin/coverage/lcov.info
          min_coverage: 95

  functions-build:
    name: Functions build (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions

      # vitest, added alongside fhir.ts — pure-function unit tests with
      # firebase-admin/@google-cloud/kms mocked at the module level (no
      # Firestore/KMS emulation), so no other setup needed beyond install.
      # --coverage self-enforces the thresholds in vitest.config.ts —
      # vitest exits non-zero if measured coverage drops below them, so
      # this one step is both the test run and the coverage gate. See
      # TESTING.md for the current threshold and backfill roadmap.
      - name: Test
        run: npm test -- --coverage
        working-directory: functions

  # Only runs on master — real Firebase resource usage (seeding/tearing
  # down live test accounts against amdash-dev), not free just because the
  # CI compute is. Test locally before pushing to any other branch (see
  # scripts/run-*-patrol-test.mjs — built to work standalone, not just in
  # CI).
  # Split from a single sequential job into six — each of these scripts is
  # already fully self-contained (seed -> `patrol test` -> teardown, all in
  # one `node` invocation), so unlike the flutter-android-e2e-* split below,
  # no upload-artifact/download-artifact plumbing is needed at all: each
  # job just runs the exact same `node <script>.mjs` command that already
  # worked sequentially, on its own runner VM. Real per-step timings before
  # this split (2026-09-02 CI run): admin 3m38s, physician 1m17s, ems
  # 3m16s, patient-flow 2m34s, physician-onboarding 4m30s, app-redirect
  # 2m6s — this job had become the tallest pole gating flutter-web-deploy,
  # taking longer end-to-end than all three flutter-android-e2e-* run jobs
  # put together.
  flutter-web-e2e-admin:
    name: Web e2e (Chrome) — admin
    runs-on: ubuntu-latest
    needs: flutter-analyze-test
    if: github.ref == 'refs/heads/master'
    # Flutter Web's engine crashes on startup ("Error: Invalid argument:
    # Incorrect locale information provided", thrown from
    # parseBrowserLanguages) when the headless Chromium Patrol/Playwright
    # launches reports a locale list the engine can't parse — which is
    # what happens on a bare ubuntu-latest runner, where LANG/LC_ALL
    # default to C/POSIX rather than a real locale. Setting a real one
    # job-wide fixes it; the runner has en_US.UTF-8 pre-generated already,
    # just not active.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7

      # Belt-and-suspenders alongside the job-level LANG/LC_ALL above:
      # locale-gen is a no-op if en_US.UTF-8 is already generated.
      - name: Ensure en_US.UTF-8 locale is generated
        run: sudo locale-gen en_US.UTF-8

      # Patrol launches Chromium headed, which needs a (virtual) display —
      # see scripts/lib/run-patrol.mjs's xvfb-run wrapping (skipped on
      # macOS, which is why Codemagic's own mac_mini_m2-based version of
      # this job never needed this step).
      - name: Ensure xvfb is installed
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `dart pub global activate` compiles patrol_cli from source — real
      # time cost, repeated identically in every e2e job every run.
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        # Pinned, not latest: patrol_cli's own compatibility checker rejects
        # a mismatched pairing against this repo's `patrol: ^4.9.0` pin
        # (all three apps) — hit this for real on a GHA run once already
        # (unpinned-latest 4.7.0 against a then-current patrol 4.8.0), so
        # don't go back to unpinned even though 4.7.0 happens to be latest
        # right now. 4.7.0 is the version whose own changelog states
        # "Requires patrol 4.9.0 or newer" — bump both together alongside
        # any future patrol/pubspec.yaml version bump.
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install scripts dependencies
        run: npm ci
        working-directory: scripts

      # `patrol test` bootstraps its own Playwright setup on demand but
      # that only downloads the browser binary, not the OS-level shared
      # libraries (libnss3, libatk, etc.) a fresh ubuntu-latest runner
      # doesn't have — without them Chromium fails to launch at all.
      # Playwright caches the downloaded browser globally
      # (~/.cache/ms-playwright), so installing it once here means
      # patrol's own later install step just finds it already present.
      - name: Install Playwright browser + OS dependencies
        run: npx playwright install --with-deps chromium
        working-directory: scripts

      # Used by the run-*-patrol-test.mjs scripts' own Admin SDK calls
      # (see scripts/lib/firebase-admin-cli.mjs) — the Admin SDK
      # auto-detects this standard env var, no extra plumbing needed.
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # Each of admin/physician/ems's own scripts creates its own throwaway
      # Firebase account (+ hospital/patient as needed), drives
      # `patrol test` against a real Chrome instance, and tears its own
      # state back down.
      - name: Run admin Patrol e2e
        run: node run-admin-patrol-test.mjs
        working-directory: scripts

      # Each job below uploads under its own artifact name — GitHub Actions
      # rejects duplicate artifact names within one workflow run, and
      # these jobs run concurrently now (they didn't when this was one
      # sequential job).
      - name: Upload Patrol reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-reports-admin
          path: |
            flutter/apps/admin/playwright-report
            flutter/apps/physician/playwright-report
            flutter/apps/ems/playwright-report
          retention-days: 7

  flutter-web-e2e-physician:
    name: Web e2e (Chrome) — physician
    runs-on: ubuntu-latest
    needs: flutter-analyze-test
    if: github.ref == 'refs/heads/master'
    # See flutter-web-e2e-admin's identical job-level env for why.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7

      - name: Ensure en_US.UTF-8 locale is generated
        run: sudo locale-gen en_US.UTF-8

      - name: Ensure xvfb is installed
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        # See flutter-web-e2e-admin's identical step for why this is
        # pinned rather than left latest.
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install scripts dependencies
        run: npm ci
        working-directory: scripts

      - name: Install Playwright browser + OS dependencies
        run: npx playwright install --with-deps chromium
        working-directory: scripts

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Run physician Patrol e2e
        run: node run-physician-patrol-test.mjs
        working-directory: scripts

      - name: Upload Patrol reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-reports-physician
          path: |
            flutter/apps/admin/playwright-report
            flutter/apps/physician/playwright-report
            flutter/apps/ems/playwright-report
          retention-days: 7

  flutter-web-e2e-ems:
    name: Web e2e (Chrome) — ems
    runs-on: ubuntu-latest
    needs: flutter-analyze-test
    if: github.ref == 'refs/heads/master'
    # See flutter-web-e2e-admin's identical job-level env for why.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7

      - name: Ensure en_US.UTF-8 locale is generated
        run: sudo locale-gen en_US.UTF-8

      - name: Ensure xvfb is installed
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        # See flutter-web-e2e-admin's identical step for why this is
        # pinned rather than left latest.
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install scripts dependencies
        run: npm ci
        working-directory: scripts

      - name: Install Playwright browser + OS dependencies
        run: npx playwright install --with-deps chromium
        working-directory: scripts

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Run EMS Patrol e2e
        run: node run-ems-patrol-test.mjs
        working-directory: scripts

      - name: Upload Patrol reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-reports-ems
          path: |
            flutter/apps/admin/playwright-report
            flutter/apps/physician/playwright-report
            flutter/apps/ems/playwright-report
          retention-days: 7

  flutter-web-e2e-patient-flow:
    name: Web e2e (Chrome) — patient flow
    runs-on: ubuntu-latest
    needs: flutter-analyze-test
    if: github.ref == 'refs/heads/master'
    # See flutter-web-e2e-admin's identical job-level env for why.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7

      - name: Ensure en_US.UTF-8 locale is generated
        run: sudo locale-gen en_US.UTF-8

      - name: Ensure xvfb is installed
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        # See flutter-web-e2e-admin's identical step for why this is
        # pinned rather than left latest.
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install scripts dependencies
        run: npm ci
        working-directory: scripts

      - name: Install Playwright browser + OS dependencies
        run: npx playwright install --with-deps chromium
        working-directory: scripts

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # Unlike the three plain per-app jobs above (each app's own UI
      # against Admin SDK-seeded state), this drives the real cross-app
      # path: an EMS account uploads a live-tracked patient through the
      # EMS app's own UI (GPS mocked via Playwright's geolocation
      # override, since a headless CI browser has no real GPS), then a
      # physician account signs in and confirms that exact patient — not
      # a seeded stand-in — shows up with a live map centered on the
      # mocked coordinates. Patrol can't drive two apps in one process, so
      # this is two sequential `patrol test` runs coordinated by shared,
      # deterministic naming rather than any live signal between them —
      # see run-patient-flow-e2e.mjs's own header comment.
      - name: Run cross-app patient flow e2e (EMS upload -> physician view)
        run: node run-patient-flow-e2e.mjs
        working-directory: scripts

      - name: Upload Patrol reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-reports-patient-flow
          path: |
            flutter/apps/admin/playwright-report
            flutter/apps/physician/playwright-report
            flutter/apps/ems/playwright-report
          retention-days: 7

  flutter-web-e2e-physician-onboarding:
    name: Web e2e (Chrome) — physician onboarding
    runs-on: ubuntu-latest
    needs: flutter-analyze-test
    if: github.ref == 'refs/heads/master'
    # See flutter-web-e2e-admin's identical job-level env for why.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7

      - name: Ensure en_US.UTF-8 locale is generated
        run: sudo locale-gen en_US.UTF-8

      - name: Ensure xvfb is installed
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

