      - name: Build + run ems Test Lab suite (Android)
        run: |
          # See flutter-android-e2e-physician's identical step for why this
          # matters.
          set -o pipefail
          ACCOUNT="$RUNNER_TEMP/ems-account.json"
          cd flutter/apps/ems
          patrol build android --target patrol_test/ems_test.dart \
            --dart-define SMOKE_EMAIL="$(jq -r .email "$ACCOUNT")" \
            --dart-define SMOKE_PASSWORD="$(jq -r .password "$ACCOUNT")" \
            --dart-define FIREBASE_APPCHECK_DEBUG_TOKEN="${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}"
          # --grant-permissions=none (gcloud *beta* only — the stable
          # `gcloud firebase test android run` has no equivalent flag at
          # all): without it, Test Lab pre-grants ACCESS_FINE_LOCATION/
          # ACCESS_COARSE_LOCATION before the test starts, so
          # LocationTrackingSection's unconditional
          # Geolocator.getCurrentPosition() call (on every
          # PatientUploadScreen mount) reaches real Google Play Services,
          # which — confirmed for real via a downloaded Test Lab video
          # recording — throws up a native "For a better experience, your
          # device will need to use Location Accuracy" dialog outside the
          # Flutter view entirely, and keeps re-showing it roughly every
          # 15s via that section's own re-poll timer for as long as the
          # form stays mounted. Denying every permission outright instead
          # (mirrors run-ems-patrol-test.mjs's webPermissions: [] on
          # Chrome) makes Geolocator fail fast with a permission error
          # before ever reaching Play Services' settings-resolution step,
          # which this app already handles correctly (the same
          # "Could not get your current location..." dialog the Chrome
          # path exercises) — no native dialog, no dismiss-and-hope. This
          # test doesn't need any OTHER runtime permission granted either.
          gcloud beta firebase test android run \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait \
            --grant-permissions=none \
            --results-bucket=gs://amdash-dev-test-lab-results \
            2>&1 | tee /tmp/ems-testlab.log

      # Permanent diagnostic — see flutter-android-e2e-physician's
      # identical step above, same rationale.
      - name: Dump ems Test Lab raw results
        if: always()
        run: |
          BUCKET_PATH=$(grep -oE 'storage/browser/[^]]+' /tmp/ems-testlab.log | head -1 | sed 's#storage/browser/##')
          if [ -z "$BUCKET_PATH" ]; then
            echo "Could not find a GCS bucket path in the run's output."
            exit 0
          fi
          echo "=== gs://$BUCKET_PATH (recursive listing) ==="
          gcloud storage ls -r "gs://$BUCKET_PATH" || true
          echo "=== catting anything text-like found above ==="
          for f in $(gcloud storage ls -r "gs://$BUCKET_PATH" 2>/dev/null | grep -E '\.(txt|xml|log)$|logcat$|instrumentation\.results$'); do
            echo "--- $f ---"
            if [[ "$f" == *logcat ]]; then
