name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Test
        run: npm test
        working-directory: marketing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Lint
        run: npm run lint
        working-directory: marketing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      - name: Build
        run: npm run build
        working-directory: marketing

  # physician/ems/admin (Flutter unit tests, web/android/ios builds, e2e,
  # and their Firebase deploy) moved to Codemagic — see codemagic.yaml at
  # the repo root. This workflow now covers only `marketing` (a standalone
  # Angular app, formerly under an Nx monorepo). Its hosting deploy is
  # deliberately kept here rather than moved to Codemagic too: `marketing`
  # isn't a Flutter app and has no reason to depend on Codemagic's
  # toolchain. This does mean marketing's deploy and the Flutter
  # apps'/functions' deploy (on Codemagic) are two independent pipelines
  # against the same amdash-dev project instead of one atomic
  # `firebase deploy` — a change/push that touches both is no longer
  # guaranteed to land together, unlike before this split.
  deploy-marketing:
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: marketing

      # This job runs on its own fresh runner (no filesystem shared with the
      # `build` job above), so the production build has to happen again
      # here too — deploy needs the actual build output on disk, not just
      # proof that it built successfully.
      - name: Build marketing
        run: npm run build
        working-directory: marketing

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Used by `firebase deploy` below. Requires a real GCP service account
      # key stored as the FIREBASE_SERVICE_ACCOUNT_KEY repo secret (Firebase
      # Console → Project Settings → Service Accounts → Generate new private
      # key, for the amdash-dev project).
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy marketing hosting to amdash-dev
        run: firebase deploy --only hosting:marketing --project amdash-dev --non-interactive
