name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Test
        run: npx nx run-many -t test
        working-directory: nx-monorepo

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Lint
        run: npx nx run-many -t lint
        working-directory: nx-monorepo

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Build
        run: npx nx run-many -t build
        working-directory: nx-monorepo

  # physician/ems/admin are Flutter apps (native + web), not Nx projects —
  # covered here instead of the Nx test/lint/build jobs above, which only
  # see `marketing` (still Angular) now.
  flutter-unit-widget-tests:
    name: Flutter unit/widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze amdash_core, physician, ems, admin
        run: |
          for dir in packages/amdash_core apps/physician apps/ems apps/admin; do
            (cd "$dir" && flutter pub get && flutter analyze)
          done
        working-directory: flutter

      - name: Run widget/unit tests
        run: |
          for dir in packages/amdash_core apps/physician apps/ems apps/admin; do
            (cd "$dir" && flutter test)
          done
        working-directory: flutter

  flutter-web-build:
    name: Flutter web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Verifies each app's web build succeeds before deploy attempts the
      # real thing on its own fresh runner. physician's DIRECTIONS_API_KEY
      # is omitted here (no map rendering happens in a plain build step);
      # deploy needs the real key so the deployed app can actually call the
      # Directions API.
      - name: Build physician/ems/admin (web)
        run: |
          for app in physician ems admin; do
            (cd "apps/$app" && flutter build web --release)
          done
        working-directory: flutter

  # admin is deliberately web-only (explicit earlier decision) — native
  # builds/tests below cover physician and ems only.
  flutter-android-build:
    name: Flutter Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter/apps/*/android/**/*.gradle*', 'flutter/apps/*/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # GitHub's hosted ubuntu-latest image ships the Android SDK
      # preinstalled (ANDROID_HOME already set) — no separate SDK setup
      # action needed, unlike a bare/self-hosted runner.
      # Builds every app even if an earlier one fails (bash's default `-e`
      # would otherwise abort the whole loop on the first failure, hiding
      # whether the *other* app has the same problem — cheaper to find out
      # in one run than by pushing a fix and waiting for round two).
      - name: Build physician/ems (Android debug APK)
        run: |
          failed=()
          for app in physician ems; do
            echo "::group::$app"
            (cd "apps/$app" && flutter build apk --debug) || failed+=("$app")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi
        working-directory: flutter

  flutter-ios-build:
    name: Flutter iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # CocoaPods' spec-repo CDN cache + Xcode's system-wide Swift Package
      # Manager checkout cache — both are the slow parts of this job ("Xcode
      # is fetching Swift Package Manager dependencies. This may take
      # several minutes..." in the first real run). Keyed off pubspec.lock
      # as a proxy for "the plugin set changed" — no Podfile.lock is
      # committed (never resolved before this phase).
      #
      # Deliberately NOT caching ~/Library/Developer/Xcode/DerivedData:
      # this job's plain `flutter build ios --no-codesign` and ios-e2e's
      # `xcodebuild build-for-testing`/`test-without-building` would share
      # that cache key, and a real run proved that's unsafe — ios-e2e
      # restored DerivedData from this job's non-test build, and
      # xcodebuild's incremental build then considered the RunnerUITests
      # product already up to date and never actually produced it
      # ("Missing test product at (null)" from `test-without-building`).
      # DerivedData is fragile to share across different build
      # invocations/schemes; the SPM checkout cache below is Xcode's own
      # dedicated, safe-to-share cache and isn't tied to build output.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.swift.swiftpm
          key: cocoapods-v2-${{ runner.os }}-${{ hashFiles('flutter/apps/physician/pubspec.lock', 'flutter/apps/ems/pubspec.lock') }}
          restore-keys: cocoapods-v2-${{ runner.os }}-

      # --no-codesign: no signing identity/provisioning profile exists yet
      # (deliberately out of scope this pass — see the plan) — this only
      # verifies the app compiles for iOS, matching flutter-android-build's
      # debug-APK-only scope. `flutter build ios` runs `pod install`
      # itself; no Podfile is checked in yet (never resolved on macOS
      # before), so this is also this repo's first real CocoaPods
      # resolution for both apps.
      - name: Build physician/ems (iOS, no codesign)
        run: |
          failed=()
          for app in physician ems; do
            echo "::group::$app"
            (cd "apps/$app" && flutter build ios --debug --no-codesign) || failed+=("$app")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi
        working-directory: flutter

  deploy:
    runs-on: ubuntu-latest
    needs:
      [
        test,
        lint,
        build,
        flutter-unit-widget-tests,
        flutter-web-build,
        flutter-android-build,
        flutter-ios-build,
      ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            nx-monorepo/package-lock.json
            functions/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install nx-monorepo dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      # This job runs on its own fresh runner (no filesystem shared with the
      # `build`/`flutter-web-build` jobs above), so the production build has to
      # happen again here too — deploy needs the actual build output on
      # disk, not just proof that it built successfully.
      - name: Build marketing
        run: npx nx run-many -t build -p marketing
        working-directory: nx-monorepo

      - name: Build physician/ems/admin (web)
        run: |
          for app in physician ems admin; do
            (cd "apps/$app" && flutter build web --release --dart-define=DIRECTIONS_API_KEY=${{ secrets.DIRECTIONS_API_KEY }})
          done
        working-directory: flutter

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Used by `firebase deploy` below. Requires a real GCP service account
      # key stored as the FIREBASE_SERVICE_ACCOUNT_KEY repo secret (Firebase
      # Console → Project Settings → Service Accounts → Generate new private
      # key, for the amdash-dev project).
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to amdash-dev
        run: firebase deploy --only hosting,functions,firestore:rules,firestore:indexes --project amdash-dev --non-interactive

  web-e2e:
    name: Web e2e (Chrome)
    runs-on: ubuntu-latest
    needs: deploy
    # Flutter Web's engine crashes on startup ("Error: Invalid argument:
    # Incorrect locale information provided", thrown from
    # parseBrowserLanguages) when the headless Chromium Patrol/Playwright
    # launches reports a locale list the engine can't parse — which is what
    # happens on a bare ubuntu-latest runner, where LANG/LC_ALL default to
    # C/POSIX rather than a real locale. Setting a real one job-wide fixes
    # it; the runner has en_US.UTF-8 pre-generated already, just not active.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      # Belt-and-suspenders alongside the job-level LANG/LC_ALL above:
      # locale-gen is a no-op if en_US.UTF-8 is already generated, so this
      # doesn't assume anything about what the runner image ships with.
      - name: Ensure en_US.UTF-8 locale is generated
        run: sudo locale-gen en_US.UTF-8

      # Patrol launches Chromium headed, which needs a (virtual) display —
      # see scripts/lib/run-patrol.mjs's xvfb-run wrapping. apt-get install
      # is a no-op if xvfb is already present, so this doesn't assume
      # anything about the runner image either.
      - name: Ensure xvfb is installed
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `dart pub global activate` compiles patrol_cli from source — real
      # time cost, repeated identically in all three e2e jobs every run.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        run: |
          dart pub global activate patrol_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      # `patrol test` bootstraps its own Node/Playwright setup inside each
      # app dir on demand ("Installing Playwright dependencies..." in its
      # own output) but that only downloads the browser binary, not the
      # OS-level shared libraries (libnss3, libatk, etc.) a fresh
      # ubuntu-latest runner doesn't have preinstalled — without them,
      # Chromium fails to launch at all and patrol exits after ~4s with no
      # test output ("Playwright process exited unexpectedly with code 1").
      # Playwright caches the downloaded browser globally
      # (~/.cache/ms-playwright), so installing it once here up front means
      # patrol's own later install step just finds it already present.
      - name: Install Playwright browser + OS dependencies
        run: npx playwright install --with-deps chromium
        working-directory: nx-monorepo

      # Used by the run-*-patrol-test.mjs scripts' own Admin SDK calls (see
      # scripts/lib/firebase-admin-cli.mjs) — the Admin SDK auto-detects
      # this standard env var, no extra plumbing needed. Same secret as the
      # `deploy` job; jobs don't share environment state, so this repeats it.
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # Each script creates its own throwaway Firebase account (+ hospital/
      # patient for physician; EMS creates/edits/deletes its own patient
      # entirely through the app's own UI) via the Admin SDK, drives
      # `patrol test` against a real Chrome instance, and tears its own
      # state back down — see nx-monorepo/scripts/run-*-patrol-test.mjs.
      - name: Run admin Patrol e2e
        run: node scripts/run-admin-patrol-test.mjs
        working-directory: nx-monorepo

      - name: Run physician Patrol e2e
        run: node scripts/run-physician-patrol-test.mjs
        working-directory: nx-monorepo

      - name: Run EMS Patrol e2e
        run: node scripts/run-ems-patrol-test.mjs
        working-directory: nx-monorepo

      - name: Upload Patrol reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-reports
          path: |
            flutter/apps/admin/playwright-report
            flutter/apps/physician/playwright-report
            flutter/apps/ems/playwright-report
          retention-days: 7

  # admin is web-only — native e2e below covers physician and ems only,
  # same as flutter-android-build/flutter-ios-build.
  android-e2e:
    name: Android e2e (emulator)
    runs-on: ubuntu-latest
    needs: [deploy, flutter-android-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter/apps/*/android/**/*.gradle*', 'flutter/apps/*/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # `dart pub global activate` compiles patrol_cli from source — real
      # time cost, repeated identically in all three e2e jobs every run.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        run: |
          dart pub global activate patrol_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # reactivecircus/android-emulator-runner needs /dev/kvm access, which
      # ubuntu-latest supports but doesn't expose by default — this udev
      # rule is that action's own documented way to enable it.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD cold boot (no snapshot) is one of the slowest parts of this
      # job. This is the action's own documented caching recipe: cache
      # ~/.android/avd + ~/.android/adb*, and on a cache miss, boot once
      # with a no-op script just to create + snapshot the AVD before the
      # real test run reuses it — subsequent runs boot from the cached
      # snapshot instead of cold.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Boots the (now cached) KVM-accelerated AVD for the duration of
      # `script:` below, runs the same run-*-patrol-test.mjs scripts as
      # web-e2e — resolved to the booted Android device id instead of
      # Chrome (see scripts/lib/run-patrol.mjs's resolveDeviceId). No
      # explicit runtime-permission-granting step: the current Patrol
      # tests don't exercise EMS's live-tracking toggle (deliberately
      # left off, same reason as web-e2e), so they shouldn't hit a
      # location permission prompt — if a future test does, `adb install
      # -g` / `pm grant` is the known fix, not yet needed.
      - name: Run Android emulator + Patrol e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # reactivecircus/android-emulator-runner runs each *line* of
          # `script:` as its own separate shell invocation — `cd` on one
          # line does not persist to the next (confirmed: the first real
          # run showed two unrelated `sh -c` calls, and the second one
          # failed to resolve scripts/... because it never saw the `cd`).
          # One &&-chained line keeps it all in a single shell.
          script: cd nx-monorepo && PATROL_DEVICE=android node scripts/run-physician-patrol-test.mjs && PATROL_DEVICE=android node scripts/run-ems-patrol-test.mjs

  ios-e2e:
    name: iOS e2e (Simulator)
    runs-on: macos-latest
    needs: [deploy, flutter-ios-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # See flutter-ios-build's identical cache step for why DerivedData
      # itself is deliberately excluded (mixing a plain build's DerivedData
      # with this job's testing build silently broke `test-without-building`
      # — "Missing test product at (null)").
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/org.swift.swiftpm
          key: cocoapods-v2-${{ runner.os }}-${{ hashFiles('flutter/apps/physician/pubspec.lock', 'flutter/apps/ems/pubspec.lock') }}
          restore-keys: cocoapods-v2-${{ runner.os }}-

      # `dart pub global activate` compiles patrol_cli from source — real
      # time cost, repeated identically in all three e2e jobs every run.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        run: |
          dart pub global activate patrol_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # `flutter devices` (used by scripts/lib/run-patrol.mjs's
      # resolveDeviceId) only lists already-booted devices — macos-latest
      # ships several pre-created Simulators, but none are booted by
      # default, so boot one explicitly first. No signing needed —
      # Simulator builds are never code-signed.
      #
      # Must pick a device from the *newest* installed iOS runtime
      # specifically, not just any "iPhone" — confirmed via a real failure:
      # patrol_cli's own generated `xcodebuild test-without-building`
      # command targets the device by both id AND `OS=latest`, and if the
      # booted device's actual runtime isn't literally the newest one
      # available, that destination match fails outright ("Unable to find
      # a device matching the provided destination specifier ... OS:latest
      # ***", even though the exact same UDID was already confirmed
      # connected moments earlier by `flutter devices`). macos-latest ships
      # multiple iOS runtimes, and grabbing the first "iPhone" match across
      # all of them isn't guaranteed to land on the newest one.
      - name: Boot an iOS Simulator
        run: |
          LATEST_RUNTIME=$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.platform == "iOS")] | max_by(.version) | .identifier')
          echo "Latest iOS runtime: $LATEST_RUNTIME"
          UDID=$(xcrun simctl list devices available --json | jq -r --arg RT "$LATEST_RUNTIME" '.devices[$RT][] | select(.name | contains("iPhone")) | .udid' | head -1)
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID"

      - name: Run physician/EMS Patrol e2e (iOS Simulator)
        run: |
          PATROL_DEVICE=ios node scripts/run-physician-patrol-test.mjs
          PATROL_DEVICE=ios node scripts/run-ems-patrol-test.mjs
        working-directory: nx-monorepo
