name: CI

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Test
        run: npx nx run-many -t test
        working-directory: nx-monorepo

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Lint
        run: npx nx run-many -t lint
        working-directory: nx-monorepo

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Build
        run: npx nx run-many -t build
        working-directory: nx-monorepo

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            nx-monorepo/package-lock.json
            functions/package-lock.json

      - name: Install nx-monorepo dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      # This job runs on its own fresh runner (no filesystem shared with the
      # `build` job above), so the production build has to happen again here
      # too — deploy needs the actual dist/ output on disk, not just proof
      # that it built successfully.
      - name: Build physician/ems/admin/marketing
        run: npx nx run-many -t build -p physician,ems,admin,marketing
        working-directory: nx-monorepo

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Used by `firebase deploy` below. Requires a real GCP service account
      # key stored as the FIREBASE_SERVICE_ACCOUNT_KEY repo secret (Firebase
      # Console → Project Settings → Service Accounts → Generate new private
      # key, for the amdash-dev project).
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to amdash-dev
        run: firebase deploy --only hosting,functions,firestore:rules,firestore:indexes --project amdash-dev --non-interactive

  e2e:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nx-monorepo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nx-monorepo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: nx-monorepo

      # Used by the e2e suites' own Admin SDK calls (see
      # apps/*-e2e/src/support/admin.ts) — the Admin SDK auto-detects this
      # standard env var, no extra plumbing needed. Same secret as the
      # `deploy` job; jobs don't share environment state, so this repeats it.
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Run physician-e2e
        run: npx playwright test --project=chromium
        working-directory: nx-monorepo/apps/physician-e2e

      - name: Run ems-e2e
        run: npx playwright test --project=chromium
        working-directory: nx-monorepo/apps/ems-e2e

      # No admin fixture account/secrets needed: admin-e2e grants itself a
      # throwaway 'admin' role via the Admin SDK the same way it grants
      # ems/physician/nurse elsewhere, then deletes that account in its own
      # afterEach — see role-assignment.spec.ts.
      - name: Run admin-e2e
        run: npx playwright test --project=chromium
        working-directory: nx-monorepo/apps/admin-e2e

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: nx-monorepo/dist/.playwright/apps/*/playwright-report
          retention-days: 7
