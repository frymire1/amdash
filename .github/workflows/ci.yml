  # Only runs on master — see flutter-web-e2e-admin's identical note on real
  # Firebase/Test Lab resource usage. Mirrors codemagic.yaml's own
  # android-e2e job (real Test Lab devices, not a local emulator) rather
  # than the older local-emulator approach this repo used before the
  # Codemagic migration — keeping the real-device upgrade, just triggering
  # it from a free runner instead of a paid one.
  # Split from a single sequential job into five (seed -> physician/ems/
  # ems-onboarding in parallel -> teardown) — each of the three build+device
  # cycles costs ~5-6 minutes on its own (APK compile, upload, Test Lab
  # device queue/boot/run, result dump), and nothing actually requires them
  # to run one after another. Separate jobs run on separate runner VMs with
  # no shared filesystem, unlike steps within one job, so the seeded account
  # JSON this job produces has to cross via actions/upload-artifact /
  # actions/download-artifact instead of just staying on disk in
  # $RUNNER_TEMP for a later step in the same job to read.
  flutter-android-e2e-seed:
    name: Android e2e (Firebase Test Lab) — seed accounts
    runs-on: ubuntu-latest
    needs: flutter-analyze-test
    if: github.ref == 'refs/heads/master'
    # Only the Firebase Admin SDK (service-account-key secret, not WIF) and
    # a Chrome-based admin UI run happen in this job — no Test Lab/gcloud
    # calls at all, so unlike the three run jobs below, no id-token: write
    # is needed here.
    permissions:
      contents: read
    # LANG/LC_ALL: same fix as flutter-web-e2e-admin's identical job-level
    # env — only needed here because of the admin-onboarding Chrome step
    # below (see its own comment).
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7

      # Belt-and-suspenders alongside the job-level LANG/LC_ALL above —
      # see flutter-web-e2e-admin's identical step.
      - name: Ensure en_US.UTF-8 locale is generated
        run: sudo locale-gen en_US.UTF-8

      # The admin-onboarding Chrome step below needs a display — see
      # flutter-web-e2e-admin's identical step for why xvfb specifically.
      - name: Ensure xvfb is installed
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        # Pinned — see the matching comment in flutter-web-e2e-admin above.
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install scripts dependencies
        run: npm ci
        working-directory: scripts

      # The admin-onboarding Chrome step below needs this — see
      # flutter-web-e2e-admin's identical step for why this is needed
      # ahead of time rather than left to patrol's own on-demand setup.
      - name: Install Playwright browser + OS dependencies
        run: npx playwright install --with-deps chromium
        working-directory: scripts

      - name: Authenticate to Firebase Admin SDK
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # Seeding and teardown are split into their own steps (rather than
      # one seed->test->teardown script per app, the way web-e2e works)
      # because `patrol build` + `gcloud ... run` doesn't fit that shape —
      # see run-physician-patrol-test.mjs / run-ems-patrol-test.mjs's
      # --seed-only/--teardown modes.
      - name: Seed physician + ems smoke accounts
        run: |
          node run-physician-patrol-test.mjs --seed-only --account-json="$RUNNER_TEMP/physician-account.json"
          node run-ems-patrol-test.mjs --seed-only --account-json="$RUNNER_TEMP/ems-account.json"
          node run-ems-onboarding-e2e.mjs --seed-only --account-json="$RUNNER_TEMP/ems-onboarding-account.json"
        working-directory: scripts

      # The admin half of the cross-app onboarding flow — see
      # run-ems-onboarding-e2e.mjs's own header comment for why this,
      # unlike everything else in this job, runs on Chrome rather than a
      # Test Lab device (admin has no native Android/iOS build at all).
      # Must run before flutter-android-e2e-ems-onboarding's build (a
      # separate downstream job): patrol build android needs the new EMS
      # account's email baked in as a --dart-define at build time, so it
      # has to actually exist first.
      - name: Create ems onboarding user via admin UI (Chrome)
        run: node run-ems-onboarding-e2e.mjs --create-user --account-json="$RUNNER_TEMP/ems-onboarding-account.json"
        working-directory: scripts

      # `if: always()` + if-no-files-found: warn so a failure partway
      # through the steps above (e.g. the Chrome create-user step) still
      # uploads whatever account JSON *did* get written — the physician/ems
      # accounts are seeded before that step ever runs, and the teardown
      # job below needs them regardless of whether the rest of this job
      # succeeded.
      - name: Upload seeded account JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-accounts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/physician-account.json
            ${{ runner.temp }}/ems-account.json
            ${{ runner.temp }}/ems-onboarding-account.json

  flutter-android-e2e-physician:
    name: Android e2e (Firebase Test Lab) — physician
    runs-on: ubuntu-latest
    needs: flutter-android-e2e-seed
    if: github.ref == 'refs/heads/master'
    # id-token: write is what lets this job request the short-lived OIDC
    # token Workload Identity Federation exchanges for GCP credentials
    # (see the file-level comment above) — required for the auth step
    # below to work at all. Setting `permissions` here replaces the
    # default token permissions for this job rather than adding to them,
    # so contents: read has to be listed explicitly too (actions/checkout
    # needs it) — it's not implied just because id-token is granted.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter/apps/*/android/**/*.gradle*', 'flutter/apps/*/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        # Pinned — see the matching comment in flutter-web-e2e-admin above.
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # ubuntu-latest's preinstalled gcloud is an apt/system package with
      # its component manager disabled entirely (confirmed for real:
      # `gcloud components install beta` fails outright with "the Google
      # Cloud CLI component manager is disabled for this installation") —
      # swap it for a real, component-manageable Cloud SDK install instead
      # of trying to extend the locked one. Installed *before* auth below
      # (standard ordering for these two actions together) so the fresh
      # install doesn't risk clobbering the auth step's own gcloud-level
      # config. `beta` isn't actually needed by this leg (only ems's own
      # run job below needs --grant-permissions), but installed
      # unconditionally anyway to keep all three run jobs' setup identical.
      - name: Install gcloud (component-manageable, with beta)
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta

      # google-github-actions/auth sets up both gcloud CLI credentials and
      # Application Default Credentials from the service account key in
      # one step — the GHA-native replacement for manually writing a key
      # file and calling `gcloud auth activate-service-account`.
      - name: Authenticate gcloud to Test Lab
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/577422583971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'codemagic-testlab@amdash-dev.iam.gserviceaccount.com'

      - name: Set gcloud project
        run: gcloud config set project amdash-dev

      - name: Download seeded account JSON
        uses: actions/download-artifact@v8
        with:
          name: android-e2e-accounts
          path: ${{ runner.temp }}

      - name: Build + run physician Test Lab suite (Android)
        run: |
          # Without pipefail, `gcloud ... | tee file` takes tee's exit code
          # (always 0), not gcloud's — silently turning a real test FAILURE
          # into a green step. Confirmed for real: once the actual Patrol
          # native setup was fixed (see MainActivityTest.java), Test Lab
          # started reporting genuine "1 test cases failed" outcomes, yet
          # this step still showed a checkmark. bash -e (GHA's default
          # shell) does not imply pipefail on its own.
          set -o pipefail
          ACCOUNT="$RUNNER_TEMP/physician-account.json"
          cd flutter/apps/physician
          patrol build android --target patrol_test/patient_flow_test.dart \
            --dart-define SMOKE_EMAIL="$(jq -r .email "$ACCOUNT")" \
            --dart-define SMOKE_PASSWORD="$(jq -r .password "$ACCOUNT")" \
            --dart-define SMOKE_HOSPITAL="$(jq -r .hospitalName "$ACCOUNT")" \
            --dart-define SMOKE_PATIENT_NAME="$(jq -r .patientName "$ACCOUNT")" \
            --dart-define FIREBASE_APPCHECK_DEBUG_TOKEN="${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}"
          # tee'd to a file (not just relying on the job log) so the next
          # DEBUG step can grep the GCS bucket path back out of it — see
          # that step's own comment for why. That next step runs via
          # `if: always()`, so this step is deliberately left free to fail
          # normally (no `|| true`) rather than swallowing whatever real
          # pass/fail signal gcloud does give — pipefail above is what
          # actually makes that true now.
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait \
            --results-bucket=gs://amdash-dev-test-lab-results \
            2>&1 | tee /tmp/physician-testlab.log

      # Permanent diagnostic, not tied to any specific investigation — the
      # gcloud CLI's own summary never shows the actual crash/error detail
      # (a real device failure just reads "1 test cases failed" with no
      # further context), so pull the GCS bucket path out of the run's own
      # "Raw results will be stored in your GCS bucket at [...]" line, list
      # everything in it, and cat anything that looks like text
      # (logcat/instrumentation.results especially). This is what made
      # every real Android e2e bug this session traceable at all —
      # including the empty-test-APK root cause, a location-permission
      # dialog invisible to Flutter's own finders, and a RenderFlex
      # overflow — worth keeping for whatever's next.
      - name: Dump physician Test Lab raw results
        if: always()
        run: |
          BUCKET_PATH=$(grep -oE 'storage/browser/[^]]+' /tmp/physician-testlab.log | head -1 | sed 's#storage/browser/##')
          if [ -z "$BUCKET_PATH" ]; then
            echo "Could not find a GCS bucket path in the run's output."
            exit 0
          fi
          echo "=== gs://$BUCKET_PATH (recursive listing) ==="
          gcloud storage ls -r "gs://$BUCKET_PATH" || true
          echo "=== catting anything text-like found above ==="
          for f in $(gcloud storage ls -r "gs://$BUCKET_PATH" 2>/dev/null | grep -E '\.(txt|xml|log)$|logcat$|instrumentation\.results$'); do
            echo "--- $f ---"
            if [[ "$f" == *logcat ]]; then
              # A full-device logcat's first ~20000 bytes are dominated by
              # boot noise (ServiceManager/AtomicFile/artd chatter) — a
              # plain head cutoff never reaches the app's own output at
              # all (confirmed for real: an ems onboarding failure dump
              # this way, needed to re-derive from timing math instead of
              # just reading it). Grep for the flutter tag first — where
              # print()/debugPrint() and Flutter's own uncaught-error
              # logging land — and keep the raw head too as a fallback in
              # case nothing flutter-tagged printed at all.
              echo "-- flutter-tagged lines --"
              gcloud storage cat "$f" 2>&1 | grep -iE ' flutter *: ' | head -c 20000
              echo "-- first 20000 bytes, unfiltered --"
              gcloud storage cat "$f" 2>&1 | head -c 20000
            else
              gcloud storage cat "$f" 2>&1 | head -c 20000
            fi
            echo
          done

  flutter-android-e2e-ems:
    name: Android e2e (Firebase Test Lab) — ems
    runs-on: ubuntu-latest
    needs: flutter-android-e2e-seed
    if: github.ref == 'refs/heads/master'
