        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/577422583971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'codemagic-testlab@amdash-dev.iam.gserviceaccount.com'

      - name: Set gcloud project
        run: gcloud config set project amdash-dev

      - name: Download seeded account JSON
        uses: actions/download-artifact@v8
        with:
          name: android-e2e-accounts
          path: ${{ runner.temp }}

      # The real onboarding leg — the seed job's Chrome-based create-user
      # step already ran (see run-ems-onboarding-e2e.mjs's own header
      # comment for why that has to happen before this build, not after);
      # this is that new account's own first-ever sign-in, on a real
      # device. No --grant-permissions=none needed here, unlike the ems
      # suite above — first_login_test.dart never reaches
      # PatientUploadScreen, so LocationTrackingSection's permission
      # dialog is never in play.
      - name: Build + run ems onboarding Test Lab suite (Android)
        run: |
          set -o pipefail
          ACCOUNT="$RUNNER_TEMP/ems-onboarding-account.json"
          cd flutter/apps/ems
          patrol build android --target patrol_test/first_login_test.dart \
            --dart-define SMOKE_EMAIL="$(jq -r .newUserEmail "$ACCOUNT")" \
            --dart-define SMOKE_NEW_PASSWORD="$(jq -r .newUserPassword "$ACCOUNT")" \
            --dart-define FIREBASE_APPCHECK_DEBUG_TOKEN="${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}"
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait \
            --results-bucket=gs://amdash-dev-test-lab-results \
            2>&1 | tee /tmp/ems-onboarding-testlab.log

      - name: Dump ems onboarding Test Lab raw results
        if: always()
        run: |
          BUCKET_PATH=$(grep -oE 'storage/browser/[^]]+' /tmp/ems-onboarding-testlab.log | head -1 | sed 's#storage/browser/##')
          if [ -z "$BUCKET_PATH" ]; then
            echo "Could not find a GCS bucket path in the run's output."
            exit 0
          fi
          echo "=== gs://$BUCKET_PATH (recursive listing) ==="
          gcloud storage ls -r "gs://$BUCKET_PATH" || true
          echo "=== catting anything text-like found above ==="
          for f in $(gcloud storage ls -r "gs://$BUCKET_PATH" 2>/dev/null | grep -E '\.(txt|xml|log)$|logcat$|instrumentation\.results$'); do
            echo "--- $f ---"
            if [[ "$f" == *logcat ]]; then
              # A full-device logcat's first ~20000 bytes are dominated by
              # boot noise (ServiceManager/AtomicFile/artd chatter) — a
              # plain head cutoff never reaches the app's own output at
              # all (confirmed for real: an ems onboarding failure dump
              # this way, needed to re-derive from timing math instead of
              # just reading it). Grep for the flutter tag first — where
              # print()/debugPrint() and Flutter's own uncaught-error
              # logging land — and keep the raw head too as a fallback in
              # case nothing flutter-tagged printed at all.
              echo "-- flutter-tagged lines --"
              gcloud storage cat "$f" 2>&1 | grep -iE ' flutter *: ' | head -c 20000
              echo "-- first 20000 bytes, unfiltered --"
              gcloud storage cat "$f" 2>&1 | head -c 20000
            else
              gcloud storage cat "$f" 2>&1 | head -c 20000
            fi
            echo
          done

  # Runs regardless of whether seeding or any of the three legs above
  # succeeded or failed — the GHA equivalent of Codemagic's
  # `publishing.scripts` guarantee. `always()` alone would also make this
  # run on branches other than master (bypassing the skip that a failed/
  # skipped `needs` job would otherwise cause), so the ref check is
  # repeated explicitly here too. `|| true` on each teardown call so one
  # app's teardown failing doesn't skip the other's; the account-JSON
  # download is allowed to fail without failing the whole job (e.g. if the
  # seed job never got as far as uploading anything) since
  # run-*-patrol-test.mjs's own --teardown mode already tolerates a missing
  # --account-json file and falls back to its age-guarded broad sweep.
  flutter-android-e2e-teardown:
    name: Android e2e (Firebase Test Lab) — teardown
    runs-on: ubuntu-latest
    needs: [flutter-android-e2e-seed, flutter-android-e2e-physician, flutter-android-e2e-ems, flutter-android-e2e-ems-onboarding]
    if: always() && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install scripts dependencies
        run: npm ci
        working-directory: scripts

      - name: Authenticate to Firebase Admin SDK
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Download seeded account JSON
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-e2e-accounts
          path: ${{ runner.temp }}

      - name: Teardown physician + ems smoke accounts
        if: always()
        run: |
          node run-physician-patrol-test.mjs --teardown --account-json="$RUNNER_TEMP/physician-account.json" || true
          node run-ems-patrol-test.mjs --teardown --account-json="$RUNNER_TEMP/ems-account.json" || true
          node run-ems-onboarding-e2e.mjs --teardown --account-json="$RUNNER_TEMP/ems-onboarding-account.json" || true
        working-directory: scripts

  # Deploys physician/ems web to Cloud Run (amdash-dev) once this exact
  # push has genuinely passed e2e on real infrastructure (Chrome +
  # Firebase Test Lab) — a green-e2e gate GitHub Actions can enforce
  # directly. ems's web build is still never meant for real EMS crews
  # (they use the native app in the field) — deploying it here keeps it
  # up to date for the user's own manual testing/QA access, not as a
  # marketed product surface. admin's web hosting and functions/
  # firestore rules deploy the same way now, just manually triggered
  # instead of on every push — see deploy-web-cloud-run.yml
  # (`-f app=admin`), deploy-functions.yml, deploy-firestore-rules.yml;
  # marketing's deploy is manual too, via deploy-web-cloud-run.yml (see
  # that file and ci.yml's own header comment) — this is the one
  # auto-deploy left in this workflow. Migrated from Firebase Hosting to
  # Cloud Run — see deploy-web-cloud-run.yml (same shared container
  # image, same github-actions-web-deploy WIF identity) for the
  # manual-redeploy version of this exact pattern, which is what this
  # job's own steps below were proven against first.
  flutter-web-deploy:
    name: Deploy physician/EMS web to amdash-dev
    runs-on: ubuntu-latest
    # Gates on the three Android run jobs (not the seed or teardown jobs —
    # deploy should wait for real test results, not cleanup succeeding; and
    # teardown itself needs: all three run jobs, so gating on them already
    # implies the whole Android leg reached a real pass/fail) and all six
    # web-e2e jobs.
    needs:
      [
        flutter-web-e2e-admin,
        flutter-web-e2e-physician,
        flutter-web-e2e-ems,
        flutter-web-e2e-patient-flow,
        flutter-web-e2e-physician-onboarding,
        flutter-web-e2e-ems-app-redirect,
        flutter-android-e2e-physician,
        flutter-android-e2e-ems,
        flutter-android-e2e-ems-onboarding,
      ]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    env:
      REGION: northamerica-northeast2
      PROJECT_ID: amdash-dev
      ARTIFACT_REPO: web-hosting
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build physician/ems (web)
        run: |
          set -e
          cd flutter
          for app in physician ems; do
            (cd "apps/$app" && flutter build web --release)
          done

      # Same WIF pattern flutter-android-e2e uses above (same pool,
      # different service account, scoped only to Cloud Run +
      # Artifact Registry deploys — see deploy-web-cloud-run.yml's own
      # comment for the exact grants and why it's a separate identity
      # from codemagic-testlab).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/577422583971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-web-deploy@amdash-dev.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker to push to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build, push, and deploy physician + ems to Cloud Run
        run: |
          set -e
          for app in physician ems; do
            IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${app}-web:${{ github.sha }}"
            docker build -f deploy/web/Dockerfile --build-arg SRC_DIR="flutter/apps/${app}/build/web" -t "$IMAGE" .
            docker push "$IMAGE"
            gcloud run deploy "${app}-web" \
              --image="$IMAGE" \
              --region="$REGION" \
              --project="$PROJECT_ID" \
              --allow-unauthenticated \
              --min-instances=0 \
              --quiet
          done
