name: Flutter CI

# Free/cheap analyze+test+build safety net on every push, plus e2e
# (Chrome + Firebase Test Lab Android) on master only. Deliberately not on
# Codemagic: none of this needs macOS, and GitHub's Linux runners are free
# on the plans this repo uses, unlike Codemagic's per-minute mac_mini_m2
# pricing (see codemagic.yaml's own history — that's exactly why its
# testing workflows were removed and this file exists instead). iOS e2e
# stays off entirely — Xcode/signing is the genuinely expensive, complex
# part regardless of which CI system runs it; flutter-deploy and the
# ios-adhoc-distribute* workflows in codemagic.yaml remain the way to get
# a real iOS build, manually, when needed.
#
# Adapted from two prior, independently-working sources rather than
# written from scratch: the pre-Codemagic-migration version of this repo's
# own ci.yml (commit 308e075^ — real, tuned fixes for locale/xvfb/caching
# on GitHub's Linux runners already exist there) for the Linux-specific
# environment setup, and codemagic.yaml's own web-e2e/android-e2e jobs
# (the more recent iteration — Firebase Test Lab real devices instead of a
# local Android emulator) for the actual test-script invocations.
#
# e2e no longer runs as a gate on a specific deploy the way it used to
# (the old ci.yml's e2e jobs had `needs: deploy`) — flutter-deploy is now
# manual-trigger-only on Codemagic, so there's no in-workflow deploy step
# left to depend on. These jobs test whatever's currently live on
# amdash-dev instead — a smoke test of current state, not a pre-deploy
# gate. Deploy manually via Codemagic, then these next run on your next
# push will exercise it.
#
# Required repo secrets (GitHub -> Settings -> Secrets and variables ->
# Actions):
#   - FIREBASE_SERVICE_ACCOUNT_KEY — already exists (used by ci.yml's
#     deploy-marketing job already).
#
# flutter-android-e2e authenticates to Google Cloud via Workload Identity
# Federation, not a service account key — this org has
# iam.managed.disableServiceAccountKeyCreation enforced (a real security
# improvement, not something to work around), which blocks minting a new
# key for the codemagic-testlab service account entirely. WIF is Google's
# recommended keyless replacement for exactly this scenario: GitHub issues
# a short-lived OIDC token per run, which Google exchanges for that
# service account's permissions, scoped so only the frymire1/amdash repo
# can do this at all — no long-lived credential stored anywhere. One-time
# setup already done (Cloud Shell, project amdash-dev):
#   - Workload identity pool: github-actions-pool
#   - Provider: github-actions-provider (OIDC issuer
#     https://token.actions.githubusercontent.com, attribute-condition
#     restricting to assertion.repository=='frymire1/amdash')
#   - codemagic-testlab@amdash-dev.iam.gserviceaccount.com granted
#     roles/iam.workloadIdentityUser to that pool's principalSet, scoped
#     to this repo.
# The job below needs `permissions: id-token: write` for GitHub to be
# allowed to mint that OIDC token in the first place — without it, the
# auth step fails even with everything above configured correctly.

on:
  push:

jobs:
  flutter-analyze-test:
    name: Flutter analyze + unit/widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze amdash_core, physician, ems, admin
        run: |
          set -e
          for dir in packages/amdash_core apps/physician apps/ems apps/admin; do
            (cd "$dir" && flutter pub get && flutter analyze)
          done
        working-directory: flutter

      - name: Run widget/unit tests
        run: |
          set -e
          for dir in packages/amdash_core apps/physician apps/ems apps/admin; do
            (cd "$dir" && flutter test)
          done
        working-directory: flutter

  functions-build:
    name: Functions build (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions

  # Only runs on master — real Firebase resource usage (seeding/tearing
  # down live test accounts against amdash-dev), not free just because the
  # CI compute is. Test locally before pushing to any other branch (see
  # scripts/run-*-patrol-test.mjs — built to work standalone, not just in
  # CI).
  flutter-web-e2e:
    name: Web e2e (Chrome)
    runs-on: ubuntu-latest
    needs: flutter-analyze-test
    if: github.ref == 'refs/heads/master'
    # Flutter Web's engine crashes on startup ("Error: Invalid argument:
    # Incorrect locale information provided", thrown from
    # parseBrowserLanguages) when the headless Chromium Patrol/Playwright
    # launches reports a locale list the engine can't parse — which is
    # what happens on a bare ubuntu-latest runner, where LANG/LC_ALL
    # default to C/POSIX rather than a real locale. Setting a real one
    # job-wide fixes it; the runner has en_US.UTF-8 pre-generated already,
    # just not active.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      # Belt-and-suspenders alongside the job-level LANG/LC_ALL above:
      # locale-gen is a no-op if en_US.UTF-8 is already generated.
      - name: Ensure en_US.UTF-8 locale is generated
        run: sudo locale-gen en_US.UTF-8

      # Patrol launches Chromium headed, which needs a (virtual) display —
      # see scripts/lib/run-patrol.mjs's xvfb-run wrapping (skipped on
      # macOS, which is why Codemagic's own mac_mini_m2-based version of
      # this job never needed this step).
      - name: Ensure xvfb is installed
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `dart pub global activate` compiles patrol_cli from source — real
      # time cost, repeated identically in both e2e jobs every run.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        # Pinned, not latest: patrol_cli's own compatibility checker rejects
        # unpinned-latest (4.7.0) against this repo's `patrol: ^4.8.0` pin
        # (all three apps) — hit this for real on a GHA run, patrol_cli
        # lags patrol's release cadence. 4.6.1 is the version patrol_cli's
        # compatibility table itself names as compatible with patrol 4.8.0;
        # bump this alongside any future patrol/pubspec.yaml version bump.
        run: |
          dart pub global activate patrol_cli 4.6.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install scripts dependencies
        run: npm ci
        working-directory: scripts

      # `patrol test` bootstraps its own Playwright setup on demand but
      # that only downloads the browser binary, not the OS-level shared
      # libraries (libnss3, libatk, etc.) a fresh ubuntu-latest runner
      # doesn't have — without them Chromium fails to launch at all.
      # Playwright caches the downloaded browser globally
      # (~/.cache/ms-playwright), so installing it once here means
      # patrol's own later install step just finds it already present.
      - name: Install Playwright browser + OS dependencies
        run: npx playwright install --with-deps chromium
        working-directory: scripts

      # Used by the run-*-patrol-test.mjs scripts' own Admin SDK calls
      # (see scripts/lib/firebase-admin-cli.mjs) — the Admin SDK
      # auto-detects this standard env var, no extra plumbing needed.
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # Each script creates its own throwaway Firebase account (+
      # hospital/patient as needed), drives `patrol test` against a real
      # Chrome instance, and tears its own state back down.
      - name: Run admin Patrol e2e
        run: node run-admin-patrol-test.mjs
        working-directory: scripts

      - name: Run physician Patrol e2e
        run: node run-physician-patrol-test.mjs
        working-directory: scripts

      - name: Run EMS Patrol e2e
        run: node run-ems-patrol-test.mjs
        working-directory: scripts

      - name: Upload Patrol reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-reports
          path: |
            flutter/apps/admin/playwright-report
            flutter/apps/physician/playwright-report
            flutter/apps/ems/playwright-report
          retention-days: 7

  # Only runs on master — see flutter-web-e2e's identical note on real
  # Firebase/Test Lab resource usage. Mirrors codemagic.yaml's own
  # android-e2e job (real Test Lab devices, not a local emulator) rather
  # than the older local-emulator approach this repo used before the
  # Codemagic migration — keeping the real-device upgrade, just triggering
  # it from a free runner instead of a paid one.
  flutter-android-e2e:
    name: Android e2e (Firebase Test Lab)
    runs-on: ubuntu-latest
    needs: flutter-analyze-test
    if: github.ref == 'refs/heads/master'
    # id-token: write is what lets this job request the short-lived OIDC
    # token Workload Identity Federation exchanges for GCP credentials
    # (see the file-level comment above) — required for the auth step
    # below to work at all. Setting `permissions` here replaces the
    # default token permissions for this job rather than adding to them,
    # so contents: read has to be listed explicitly too (actions/checkout
    # needs it) — it's not implied just because id-token is granted.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter/apps/*/android/**/*.gradle*', 'flutter/apps/*/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-patrol-cli

      - name: Install patrol_cli
        # Pinned — see the matching comment in flutter-web-e2e above.
        run: |
          dart pub global activate patrol_cli 4.6.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install scripts dependencies
        run: npm ci
        working-directory: scripts

      - name: Authenticate to Firebase Admin SDK
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # google-github-actions/auth sets up both gcloud CLI credentials and
      # Application Default Credentials from the service account key in
      # one step — the GHA-native replacement for manually writing a key
      # file and calling `gcloud auth activate-service-account`.
      - name: Authenticate gcloud to Test Lab
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/577422583971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'codemagic-testlab@amdash-dev.iam.gserviceaccount.com'

      - name: Set gcloud project
        run: gcloud config set project amdash-dev

      # TEMPORARY diagnostic — both physician and ems runs have hit "A
      # non-retryable error occurred" after 1-2s of real device time (before
      # the app could plausibly even finish launching), yet gcloud's own
      # summary + exit code report success, so this job isn't a trustworthy
      # signal right now. Cheap (no APK build/upload/device time) sanity
      # check on whether tokay+API 35 is still a valid, supported Test Lab
      # catalog entry, to rule that in/out before spending real device time
      # chasing other theories. First attempt used the wrong filter field
      # (modelId isn't real — "WARNING: filter keys were not present in any
      # resource: modelId", 0 items — but it also printed "WARNING: Some
      # devices are deprecated", a real hint), so dump the full catalog
      # this time and grep client-side instead of trusting --filter syntax
      # I can't verify locally. Remove once root-caused.
      - name: DEBUG - dump Android Test Lab device catalog
        run: |
          gcloud firebase test android models list --format=json > /tmp/models.json
          echo "=== tokay entry (if any), raw JSON so field names are verifiable ==="
          jq '.[] | select(.id == "tokay")' /tmp/models.json
          echo "=== full catalog, default table format ==="
          gcloud firebase test android models list

      # Seeding and teardown are split into their own steps (rather than
      # one seed->test->teardown script per app, the way web-e2e works)
      # because `patrol build` + `gcloud ... run` doesn't fit that shape —
      # see run-physician-patrol-test.mjs / run-ems-patrol-test.mjs's
      # --seed-only/--teardown modes.
      - name: Seed physician + ems smoke accounts
        run: |
          node run-physician-patrol-test.mjs --seed-only --account-json="$RUNNER_TEMP/physician-account.json"
          node run-ems-patrol-test.mjs --seed-only --account-json="$RUNNER_TEMP/ems-account.json"
        working-directory: scripts

      - name: Build + run physician Test Lab suite (Android)
        run: |
          ACCOUNT="$RUNNER_TEMP/physician-account.json"
          cd flutter/apps/physician
          patrol build android --target patrol_test/patient_flow_test.dart \
            --dart-define SMOKE_EMAIL="$(jq -r .email "$ACCOUNT")" \
            --dart-define SMOKE_PASSWORD="$(jq -r .password "$ACCOUNT")" \
            --dart-define SMOKE_HOSPITAL="$(jq -r .hospitalName "$ACCOUNT")" \
            --dart-define SMOKE_PATIENT_NAME="$(jq -r .patientName "$ACCOUNT")"
          # tee'd to a file (not just relying on the job log) so the next
          # DEBUG step can grep the GCS bucket path back out of it — see
          # that step's own comment for why. That next step runs via
          # `if: always()`, so this step is deliberately left free to fail
          # normally (no `|| true`) rather than swallowing whatever real
          # pass/fail signal gcloud does give.
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=tokay,version=35,locale=en,orientation=portrait \
            --results-bucket=gs://amdash-dev-test-lab-results \
            2>&1 | tee /tmp/physician-testlab.log

      # TEMPORARY diagnostic — see flutter-android-e2e's device-catalog
      # diagnostic step above for the full background. tokay/API 35 turned
      # out to be a perfectly valid, current, non-deprecated device, which
      # rules that theory out — so the actual crash/error detail has to
      # come from Test Lab's own raw results (logcat + instrumentation
      # output), which the gcloud CLI's own summary never shows. Pull the
      # GCS bucket path out of the run's own "Raw results will be stored
      # in your GCS bucket at [...]" line, list everything in it, and cat
      # anything that looks like text. Remove once root-caused.
      - name: DEBUG - dump physician Test Lab raw results
        if: always()
        run: |
          BUCKET_PATH=$(grep -oE 'storage/browser/[^]]+' /tmp/physician-testlab.log | head -1 | sed 's#storage/browser/##')
          if [ -z "$BUCKET_PATH" ]; then
            echo "Could not find a GCS bucket path in the run's output."
            exit 0
          fi
          echo "=== gs://$BUCKET_PATH (recursive listing) ==="
          gcloud storage ls -r "gs://$BUCKET_PATH" || true
          echo "=== catting anything text-like found above ==="
          for f in $(gcloud storage ls -r "gs://$BUCKET_PATH" 2>/dev/null | grep -E '\.(txt|xml|log)$|logcat$'); do
            echo "--- $f ---"
            gcloud storage cat "$f" 2>&1 | head -c 20000
            echo
          done

      - name: Build + run ems Test Lab suite (Android)
        run: |
          ACCOUNT="$RUNNER_TEMP/ems-account.json"
          cd flutter/apps/ems
          patrol build android --target patrol_test/ems_test.dart \
            --dart-define SMOKE_EMAIL="$(jq -r .email "$ACCOUNT")" \
            --dart-define SMOKE_PASSWORD="$(jq -r .password "$ACCOUNT")"
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=tokay,version=35,locale=en,orientation=portrait \
            --results-bucket=gs://amdash-dev-test-lab-results \
            2>&1 | tee /tmp/ems-testlab.log

      # TEMPORARY diagnostic — see the physician one above, same rationale.
      - name: DEBUG - dump ems Test Lab raw results
        if: always()
        run: |
          BUCKET_PATH=$(grep -oE 'storage/browser/[^]]+' /tmp/ems-testlab.log | head -1 | sed 's#storage/browser/##')
          if [ -z "$BUCKET_PATH" ]; then
            echo "Could not find a GCS bucket path in the run's output."
            exit 0
          fi
          echo "=== gs://$BUCKET_PATH (recursive listing) ==="
          gcloud storage ls -r "gs://$BUCKET_PATH" || true
          echo "=== catting anything text-like found above ==="
          for f in $(gcloud storage ls -r "gs://$BUCKET_PATH" 2>/dev/null | grep -E '\.(txt|xml|log)$|logcat$'); do
            echo "--- $f ---"
            gcloud storage cat "$f" 2>&1 | head -c 20000
            echo
          done

      # Runs regardless of whether the steps above succeeded or failed —
      # the GHA equivalent of Codemagic's `publishing.scripts` guarantee.
      # `|| true` on each so one app's teardown failing doesn't skip the
      # other's.
      - name: Teardown physician + ems smoke accounts
        if: always()
        run: |
          node run-physician-patrol-test.mjs --teardown --account-json="$RUNNER_TEMP/physician-account.json" || true
          node run-ems-patrol-test.mjs --teardown --account-json="$RUNNER_TEMP/ems-account.json" || true
        working-directory: scripts
