name: Deploy web app to Cloud Run

# Manual-trigger-only (Actions tab -> this workflow -> Run workflow, or
# `gh workflow run deploy-web-cloud-run.yml -f app=marketing`). Builds
# one of the 4 static web apps, packages it with deploy/web/Dockerfile
# (shared across all 4 — see that file's own comment), pushes to
# Artifact Registry, and deploys it to Cloud Run.
#
# This is the Firebase Hosting -> Cloud Run migration's deploy path, and
# all 4 apps have now migrated. physician/ems redeploy automatically
# from ci.yml's flutter-web-deploy job instead (push+e2e-gated) — this
# workflow is what that job's own steps were proven against first, and
# it stays around afterward as an on-demand manual redeploy tool for
# either of them too. admin and marketing have no automatic trigger at
# all (mirrors marketing's own reasoning: infrequent enough that
# auto-deploying on every push isn't worth it) — this workflow is their
# only/permanent deploy path, same as codemagic.yaml's own
# manual-trigger-only ios-adhoc-distribute workflows are for iOS builds.
#
# One-time GCP setup required before this can run (can't be done from
# here — see the migration plan / PR description for the exact
# commands): a `github-actions-web-deploy` service account, WIF-trusted
# for this repo (same pool as ci.yml's flutter-android-e2e-* jobs), granted
# roles/run.admin + roles/artifactregistry.writer + roles/logging.viewer
# on the amdash-dev project and roles/iam.serviceAccountUser on its
# default compute service account (Cloud Run's default runtime
# identity).

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build and deploy
        required: true
        type: choice
        options:
          - physician
          - ems
          - admin
          - marketing

# WEB_DEPLOY_SA is the dedicated service account created for this
# workflow (see the file-level comment above) — distinct from
# codemagic-testlab, which stays scoped to Test Lab only, so an audit
# of either service account's grants shows exactly one purpose per
# identity rather than an unrelated grab-bag.
env:
  REGION: northamerica-northeast2
  PROJECT_ID: amdash-dev
  ARTIFACT_REPO: web-hosting
  WEB_DEPLOY_SA: github-actions-web-deploy@amdash-dev.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build + deploy ${{ inputs.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Only the selected app's toolchain gets set up/built — Flutter
      # for physician/ems/admin, Node+Angular for marketing.
      - uses: subosito/flutter-action@v2
        if: inputs.app != 'marketing'
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v7
        if: inputs.app == 'marketing'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Build Flutter web app
        if: inputs.app != 'marketing'
        run: |
          set -e
          cd "flutter/apps/${{ inputs.app }}"
          # APP_CHECK_RECAPTCHA_SITE_KEY: a reCAPTCHA Enterprise Key ID, not
          # a secret — reCAPTCHA site/key IDs are meant to be embedded in
          # client code (see each app's main.dart, same reasoning as its own
          # comment there), so this is a plain literal, not a repo secret.
          # Registered against exactly the three real Cloud Run hostnames
          # this workflow deploys to (admin-web/physician-web/ems-web) — CI's
          # own e2e builds (ci.yml) deliberately don't pass this: they run on
          # localhost, a domain the key was never registered for, so it
          # wouldn't validate there regardless, and App Check is monitor-mode
          # only (an unverified token there is harmless, just logged).
          flutter build web --release \
            --dart-define=APP_CHECK_RECAPTCHA_SITE_KEY=6Ld6eaItAAAAAMigfWyO0OQ6x0ycufLolu5kcPgn
          echo "SRC_DIR=flutter/apps/${{ inputs.app }}/build/web" >> "$GITHUB_ENV"

      - name: Build marketing (Angular)
        if: inputs.app == 'marketing'
        run: |
          set -e
          cd marketing
          npm ci
          npm run build
          echo "SRC_DIR=marketing/dist/browser" >> "$GITHUB_ENV"

      # google-github-actions/auth sets up Application Default
      # Credentials via WIF from the short-lived OIDC token GitHub
      # issues for this run — see ci.yml's flutter-android-e2e-physician/
      # -ems/-ems-onboarding jobs for the identical pattern this mirrors
      # (same pool/provider, different service account).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/577422583971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: ${{ env.WEB_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker to push to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # The `create` fallback here is aspirational, not load-bearing:
      # github-actions-web-deploy only has roles/artifactregistry.writer
      # (push/pull to an existing repo), not the broader admin-ish role
      # that includes artifactregistry.repositories.create — confirmed
      # for real on the first run of this workflow
      # (PERMISSION_DENIED on `create`, after `describe` correctly
      # 404'd on the not-yet-created repo). That's deliberate, the same
      # reasoning as kms.ts's key ring: repo creation is a one-time
      # infra decision, not something a CI deploy identity should be
      # able to do unsupervised. The repo itself is provisioned once,
      # manually:
      #   gcloud artifacts repositories create web-hosting \
      #     --repository-format=docker \
      #     --location=northamerica-northeast2 --project=amdash-dev
      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "$ARTIFACT_REPO" \
            --location="$REGION" --project="$PROJECT_ID" \
            || gcloud artifacts repositories create "$ARTIFACT_REPO" \
                 --repository-format=docker --location="$REGION" \
                 --project="$PROJECT_ID"

      - name: Build and push image
        run: |
          set -e
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${{ inputs.app }}-web:${{ github.sha }}"
          docker build -f deploy/web/Dockerfile --build-arg SRC_DIR="$SRC_DIR" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # min-instances=0: scale-to-zero, matching this project's current
      # low-traffic dev/QA usage — occasional cold start (~1-3s) on the
      # first hit after idle, near-$0 cost otherwise. Bump later with a
      # one-line change if these become steadier-traffic production
      # apps. allow-unauthenticated: these are public sites, same as
      # Firebase Hosting served them.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ inputs.app }}-web" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --allow-unauthenticated \
            --min-instances=0 \
            --quiet

      # gcloud run deploy's own failure message is just "container
      # failed to start and listen on $PORT" — the actual crash reason
      # (e.g. an nginx config test failure) only shows up in Cloud
      # Logging, not in this job's own output otherwise.
      - name: Dump Cloud Run revision logs on failure
        if: failure()
        run: |
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${{ inputs.app }}-web" \
            --project="$PROJECT_ID" \
            --freshness=30m \
            --limit=200 \
            --order=asc \
            --format=json
