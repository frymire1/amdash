# Generates every platform's app icon from the one AmDash Signal Blue
# source (see assets/icon/) — run via `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#2563EB"
    theme_color: "#2563EB"
