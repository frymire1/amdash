# Generates the web icon set from the one AmDash Arctic Cyan source (see
# assets/icon/), shared across every AmDash app — run via
# `dart run flutter_launcher_icons`. Web-only — this app has no
# Android/iOS target.
flutter_launcher_icons:
  android: false
  ios: false
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#071618"
    theme_color: "#12A7B5"
