name: physician
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+27

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  amdash_core:
    path: ../../packages/amdash_core
  # patient_viewer.dart's clock.now() indirection — already a transitive
  # dependency (fake_async pulls it in), pinned directly here since it's
  # imported by real lib/ code now, not just tests. DateTime.now() itself
  # can't be intercepted via Zone (same finding as amdash_core's
  # idle_timeout_wrapper.dart), so there'd be no seam-free way to
  # deterministically test the glide-animation ticker or the directions-
  # refresh throttle without this; production behavior is unchanged (the
  # unoverridden `clock` global just calls real DateTime.now()).
  clock: ^1.1.2
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  cloud_functions: ^6.0.3
  firebase_messaging: ^16.0.4
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  google_maps_flutter: ^2.13.1
  http: ^1.6.0
  # Pinned below 7.1.0: that release added an unguarded reference to
  # NWPath.isUltraConstrained (a Network framework API introduced in the
  # iOS 26 SDK), which fails to compile on Xcode < 26.1.1 ("Value of type
  # 'NWPath' has no member 'isUltraConstrained'") — confirmed via a real
  # CI failure on the Xcode 16.4 toolchain this repo is pinned to (see
  # ci.yml's macos-15 pin, itself working around a different Xcode 26 bug).
  connectivity_plus: ">=7.0.0 <7.1.0"
  intl: ^0.20.2
  web: ^1.1.0
  firebase_app_check: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  patrol: ^4.9.0
  # patrol_test only — computes real TOTP codes from the on-screen secret
  # to drive mandatory MFA enrollment in e2e (see patient_flow_test.dart);
  # never used by the shipping app.
  otp: ^3.2.0
  # patrol_test only — shared tap/enterText/pumpUntil/MFA helpers reused
  # across admin/ems/physician's own patrol_test/ suites, instead of each
  # file duplicating its own copies.
  amdash_patrol_helpers:
    path: ../../packages/amdash_patrol_helpers

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  # Unit-test mocking stack — see amdash_core/pubspec.yaml's identical
  # entries and /TESTING.md for the rationale.
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.1.0
  firebase_auth_mocks: ^0.15.2
  # Widget-testing only (Stage C1, patient_viewer.dart) — both already
  # transitive dependencies (via google_maps_flutter), pinned directly here
  # since test code imports them directly for the MockPlatformInterfaceMixin
  # pattern (see TESTING.md).
  google_maps_flutter_platform_interface: ^2.16.0
  plugin_platform_interface: ^2.1.8
  # Widget-testing only (Stage C1) — already a transitive dependency (via
  # amdash_core), pinned directly here since flutter_test_config.dart
  # imports it directly for the GoogleFonts.allowRuntimeFetching guard
  # (see TESTING.md).
  google_fonts: ^6.2.1
  # Widget-testing only (Stage C2, user_settings_screen.dart) — already a
  # transitive dependency (via amdash_core's themeModeProvider), pinned
  # directly here since test code calls
  # SharedPreferences.setMockInitialValues() directly to keep
  # ThemeModeNotifier.build()'s fire-and-forget _load() from hitting a real,
  # unmocked platform channel (see TESTING.md).
  shared_preferences: ^2.3.3

# Read by patrol_cli — package_name feeds the PATROL_APP_PACKAGE_NAME
# dart-define and `patrol test`'s own instrumentation-component
# resolution. This section was missing entirely (found while root-causing
# why Android Test Lab's "e2e" runs had been silently testing nothing —
# see android/app/src/androidTest/.../MainActivityTest.java, the actual
# fix for that) — restoring it per Patrol's official setup doc even
# though it wasn't itself the cause of the empty-APK bug.
patrol:
  app_name: AmDash Physician
  android:
    package_name: com.amdash.physician

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
