name: amdash_core
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  cloud_functions: ^6.0.3
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  # See physician/pubspec.yaml's identical pin — 7.1.0+ fails to compile
  # on Xcode < 26.1.1.
  connectivity_plus: ">=7.0.0 <7.1.0"
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0
  # Matches physician's/ems's own pin.
  intl: ^0.20.2
  file_saver: ^0.4.0
  # Matches physician's own pin — for AuthService's post-sign-out reload
  # (see reload_page_web.dart).
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Unit-test mocking stack (see /TESTING.md) — no build_runner/code-gen
  # step for any of these, matching this repo's existing no-codegen
  # convention. mocktail mocks FirebaseFunctions/HttpsCallable and other
  # interface-shaped dependencies; fake_cloud_firestore/firebase_auth_mocks
  # are real in-memory fakes for Firestore/Auth-backed services and
  # providers, confirmed compatible with this package's pinned
  # cloud_firestore ^6.x/firebase_auth ^6.x.
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.1.0
  firebase_auth_mocks: ^0.15.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The Arctic Cyan mark (transparent-background pulse-line, same source as
  # the app icons/splash) — used by the shared NavBar, so it lives here in
  # the shared package rather than being duplicated per app. Referenced as
  # a package asset: Image.asset('assets/logo.png', package: 'amdash_core').
  assets:
    - assets/logo.png

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
